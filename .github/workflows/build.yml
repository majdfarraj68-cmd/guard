          package com.example.guard

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          // ACTION_USER_PRESENT cannot be received by a manifest receiver on modern Android,
          // so this small foreground service registers it at runtime and re-arms the VPN on every unlock.
          class WatcherService : Service() {
              private var registered = false

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_USER_PRESENT) {
                          VpnController.ensureStarted(context, "unlock")
                      }
                  }
              }

              companion object {
                  private const val CH = "guard_watch"
                  private const val ID = 1

                  // reason: "start" (user pressed Start), "boot" (phone restarted / app updated),
                  //         "ensure" (app opened, just make sure the watcher is alive)
                  fun start(c: Context, reason: String) {
                      if (!Prefs.armed(c)) return
                      try {
                          c.startForegroundService(Intent(c, WatcherService::class.java).putExtra("reason", reason))
                      } catch (t: Throwable) {
                          Prefs.setDbg(c, "err", "watcher: $t")
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val reason = intent?.getStringExtra("reason") ?: "sticky"
                  if (!goForeground()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!Prefs.armed(this)) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  register()
                  VpnController.ensureStarted(this, reason)
                  return START_STICKY
              }

              private fun goForeground(): Boolean {
                  return try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH, "حارس", NotificationManager.IMPORTANCE_LOW))
                      val n = Notification.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("حارس")
                          .setContentText("الحماية تعمل تلقائيًا عند كل فتح للقفل")
                          .setOngoing(true)
                          .build()
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(ID, n)
                      }
                      true
                  } catch (t: Throwable) {
                      Prefs.setDbg(this, "err", "foreground: $t")
                      false
                  }
              }

              private fun register() {
                  if (registered) return
                  try {
                      val f = IntentFilter(Intent.ACTION_USER_PRESENT)
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED)
                      } else {
                          registerReceiver(receiver, f)
                      }
                      registered = true
                  } catch (t: Throwable) {
                      Prefs.setDbg(this, "err", "register: $t")
                  }
              }

              override fun onDestroy() {
                  if (registered) {
                      try { unregisterReceiver(receiver) } catch (_: Throwable) {}
                      registered = false
                  }
                  super.onDestroy()
              }
          }
