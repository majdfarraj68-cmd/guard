          cat > app/src/main/java/com/example/guard/VpnController.kt <<'EOF_FILE'
          package com.example.guard

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.os.SystemClock
          import java.text.SimpleDateFormat
          import java.util.Date

          object VpnController {
              @Volatile private var lastAttempt = 0L

              // Single guarded entry point for starting the VPN. Safe to call any number of times:
              //  - does nothing until first-time setup is done (armed)
              //  - "unlock" / "boot" / "start" end a Stop-pause; other reasons ("ensure", "sticky") respect it
              //  - does nothing if the VPN is already running
              //  - at most one attempt every 2 seconds
              //  - never shows UI: if VPN consent is missing it only posts a notification
              @Synchronized
              fun ensureStarted(ctx: Context, reason: String) {
                  val app = ctx.applicationContext
                  try {
                      if (!Prefs.armed(app)) return
                      if (reason == "unlock" || reason == "boot" || reason == "start") Prefs.setPaused(app, false)
                      if (Prefs.paused(app)) return
                      if (BlockVpnService.running) return
                      val now = SystemClock.elapsedRealtime()
                      if (lastAttempt != 0L && now - lastAttempt < 2000) return
                      lastAttempt = now
                      if (VpnService.prepare(app) != null) {
                          Prefs.setDbg(app, "err", "إذن VPN ناقص: افتح التطبيق واضغط Start")
                          notifyNeedsOpen(app)
                          return
                      }
                      app.startService(Intent(app, BlockVpnService::class.java))
                      Prefs.setDbg(app, "auto", SimpleDateFormat("HH:mm:ss").format(Date()) + " ($reason)")
                      Prefs.setDbg(app, "err", "")
                  } catch (t: Throwable) {
                      Prefs.setDbg(app, "err", "auto: $t")
                  }
              }

              private fun notifyNeedsOpen(c: Context) {
                  try {
                      val nm = c.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel("guard_alert", "تنبيهات حارس", NotificationManager.IMPORTANCE_DEFAULT))
                      val pi = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      val n = Notification.Builder(c, "guard_alert")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("حارس")
                          .setContentText("افتح التطبيق واضغط Start لإعادة تفعيل إذن VPN")
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      nm.notify(2, n)
                  } catch (_: Throwable) {}
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/WatcherService.kt <<'EOF_FILE'
          package com.example.guard

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          // ACTION_USER_PRESENT cannot be received by a manifest receiver on modern Android,
          // so this small foreground service registers it at runtime and re-arms the VPN on every unlock.
          class WatcherService : Service() {
              private var registered = false

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == Intent.ACTION_USER_PRESENT) {
                          VpnController.ensureStarted(context, "unlock")
                      }
                  }
              }

              companion object {
                  private const val CH = "guard_watch"
                  private const val ID = 1

                  // reason: "start" (user pressed Start), "boot" (phone restarted / app updated),
                  //         "ensure" (app opened, just make sure the watcher is alive)
                  fun start(c: Context, reason: String) {
                      if (!Prefs.armed(c)) return
                      try {
                          c.startForegroundService(Intent(c, WatcherService::class.java).putExtra("reason", reason))
                      } catch (t: Throwable) {
                          Prefs.setDbg(c, "err", "watcher: $t")
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val reason = intent?.getStringExtra("reason") ?: "sticky"
                  if (!goForeground()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!Prefs.armed(this)) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  register()
                  VpnController.ensureStarted(this, reason)
                  return START_STICKY
              }

              private fun goForeground(): Boolean {
                  return try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH, "حارس", NotificationManager.IMPORTANCE_LOW))
                      val n = Notification.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("حارس")
                          .setContentText("الحماية تعمل تلقائيًا عند كل فتح للقفل")
                          .setOngoing(true)
                          .build()
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(ID, n)
                      }
                      true
                  } catch (t: Throwable) {
                      Prefs.setDbg(this, "err", "foreground: $t")
                      false
                  }
              }

              private fun register() {
                  if (registered) return
                  try {
                      val f = IntentFilter(Intent.ACTION_USER_PRESENT)
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED)
                      } else {
                          registerReceiver(receiver, f)
                      }
                      registered = true
                  } catch (t: Throwable) {
                      Prefs.setDbg(this, "err", "register: $t")
                  }
              }

              override fun onDestroy() {
                  if (registered) {
                      try { unregisterReceiver(receiver) } catch (_: Throwable) {}
                      registered = false
                  }
                  super.onDestroy()
              }
          }
