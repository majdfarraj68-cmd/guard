          package com.example.guard

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          // Design tokens + small view helpers (everything is built in code, no XML layouts).
          object T {
              const val BG_TOP = 0xFF070F1C.toInt()
              const val BG_MID = 0xFF0B1C30.toInt()
              const val BG_BOT = 0xFF0C2F3E.toInt()
              const val CARD = 0x1FFFFFFF
              const val CARD_STROKE = 0x2EFFFFFF
              const val GREEN = 0xFF2EE59D.toInt()
              const val GREEN_D = 0xFF11998E.toInt()
              const val BLUE = 0xFF4FB3F6.toInt()
              const val BLUE_D = 0xFF1B6FB5.toInt()
              const val AMBER = 0xFFFFB74D.toInt()
              const val AMBER_D = 0xFFE08A1E.toInt()
              const val TEXT = 0xFFF2F7FA.toInt()
              const val SUB = 0xFFA3B6C2.toInt()
              const val MUTED = 0xFF6F8794.toInt()
              const val ON_GREEN = 0xFF04281F.toInt()
              const val ON_AMBER = 0xFF2B1700.toInt()
              const val MATCH = -1
              const val WRAP = -2

              fun dp(c: Context, v: Int): Int = (v * c.resources.displayMetrics.density + 0.5f).toInt()

              fun lpd(c: Context, w: Int, h: Int, l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h)
                  p.setMargins(dp(c, l), dp(c, t), dp(c, r), dp(c, b))
                  return p
              }

              fun space(c: Context, w: Int, h: Int): View {
                  val v = View(c)
                  v.layoutParams = LinearLayout.LayoutParams(dp(c, w), dp(c, h))
                  return v
              }

              fun screenBg(): GradientDrawable =
                  GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(BG_TOP, BG_MID, BG_BOT))

              fun card(c: Context, radius: Int = 22, fill: Int = CARD, stroke: Int = CARD_STROKE): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.RECTANGLE
                  g.cornerRadius = dp(c, radius).toFloat()
                  g.setColor(fill)
                  g.setStroke(dp(c, 1), stroke)
                  return g
              }

              fun grad(c: Context, a: Int, b: Int, radius: Int = 18): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(a, b))
                  g.cornerRadius = dp(c, radius).toFloat()
                  return g
              }

              fun outline(c: Context, color: Int, radius: Int = 18): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.RECTANGLE
                  g.cornerRadius = dp(c, radius).toFloat()
                  g.setColor(0)
                  g.setStroke(dp(c, 2), color)
                  return g
              }

              fun oval(color: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(color)
                  return g
              }

              // soft radial light used behind the shield
              fun halo(c: Context, color: Int, sizeDp: Int): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(color, color and 0x00FFFFFF))
                  g.shape = GradientDrawable.OVAL
                  g.gradientType = GradientDrawable.RADIAL_GRADIENT
                  g.gradientRadius = dp(c, sizeDp).toFloat() / 2f
                  return g
              }

              fun text(c: Context, s: String, sp: Float, color: Int = TEXT, bold: Boolean = false): TextView {
                  val t = TextView(c)
                  t.text = s
                  t.textSize = sp
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  t.setLineSpacing(0f, 1.2f)
                  return t
              }

              fun button(c: Context, label: String, bg: GradientDrawable, color: Int): TextView {
                  val t = text(c, label, 17f, color, true)
                  t.gravity = Gravity.CENTER
                  t.background = bg
                  t.setPadding(dp(c, 16), dp(c, 16), dp(c, 16), dp(c, 16))
                  t.isClickable = true
                  pressable(t)
                  return t
              }

              fun pressable(v: View) {
                  v.setOnTouchListener { view, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> view.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> view.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                      }
                      false
                  }
              }

              fun roundIcon(c: Context, kind: Int, onClick: () -> Unit): View {
                  val f = FrameLayout(c)
                  f.background = card(c, 22)
                  f.addView(IconView(c, kind, TEXT), FrameLayout.LayoutParams(dp(c, 22), dp(c, 22), Gravity.CENTER))
                  f.setOnClickListener { onClick() }
                  pressable(f)
                  return f
              }

              fun countTo(tv: TextView, from: Int, to: Int) {
                  if (from == to) {
                      tv.text = to.toString()
                      return
                  }
                  val a = ValueAnimator.ofInt(from, to)
                  a.duration = 600
                  a.addUpdateListener { tv.text = (it.animatedValue as Int).toString() }
                  a.start()
              }
          }
