          package com.example.guard

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.Toast

          // Hosts the three pages (home, victory log, settings) and owns the protection actions.
          // The blocking itself (BlockVpnService / VpnController / WatcherService / BootReceiver) is unchanged.
          class MainActivity : Activity() {
              private lateinit var frame: FrameLayout
              private lateinit var home: HomePage
              private lateinit var logPage: LogPage
              private lateinit var settings: SettingsPage
              private var current: Page? = null
              private var pendingShield = false
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() {
                      current?.refresh()
                      h.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = T.BG_TOP
                  window.navigationBarColor = T.BG_BOT
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
                  }
                  frame = FrameLayout(this)
                  frame.setBackgroundColor(T.BG_TOP)
                  setContentView(frame)
                  home = HomePage(this)
                  logPage = LogPage(this)
                  settings = SettingsPage(this)
                  show(home, true)
              }

              // ---- navigation (fade + slide) ----
              private fun show(p: Page, forward: Boolean) {
                  val old = current
                  if (old === p) return
                  current = p
                  val dist = T.dp(this, 28).toFloat()
                  p.root.animate().cancel()
                  (p.root.parent as? ViewGroup)?.removeView(p.root)
                  p.root.alpha = 0f
                  p.root.translationX = if (forward) -dist else dist
                  frame.addView(p.root, FrameLayout.LayoutParams(T.MATCH, T.MATCH))
                  p.refresh()
                  p.root.animate().alpha(1f).translationX(0f).setDuration(260)
                      .setInterpolator(DecelerateInterpolator()).start()
                  p.onShown()
                  if (old != null) {
                      old.onHidden()
                      old.root.animate().alpha(0f).translationX(if (forward) dist else -dist).setDuration(200)
                          .withEndAction { if (current !== old) frame.removeView(old.root) }.start()
                  }
              }

              fun goHome() = show(home, false)
              fun goLog() = show(logPage, true)
              fun goSettings() = show(settings, true)

              override fun onBackPressed() {
                  if (current !== home) show(home, false) else super.onBackPressed()
              }

              // ---- small helpers used by the pages ----
              fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              }

              fun confirm(title: String, msg: String, yes: String, onYes: () -> Unit) {
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(title)
                      .setMessage(msg)
                      .setPositiveButton(yes) { _, _ -> onYes() }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              // ---- protection actions ----
              fun toggleProtection() {
                  if (BlockVpnService.running) requestStop() else requestStart()
              }

              fun requestStart() {
                  // VPN consent is asked once, with the system dialog; nothing is skipped or forced
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 77) else launch()
              }

              fun startShield() {
                  pendingShield = true
                  requestStart()
              }

              private fun launch() {
                  Prefs.setArmed(this, true)
                  Prefs.setPaused(this, false)
                  startService(Intent(this, BlockVpnService::class.java))
                  WatcherService.start(this, "start")
                  if (pendingShield) {
                      pendingShield = false
                      Prefs.setShieldUntil(this, System.currentTimeMillis() + 10L * 60L * 1000L)
                  }
                  current?.refresh()
              }

              fun requestStop() {
                  val left = Prefs.shieldLeft(this)
                  if (left > 0L) {
                      toast("الدرع نشط: لا يمكن إيقاف الحماية الآن (باقي " + ((left / 60000L) + 1L) + " د)")
                      return
                  }
                  if (!BlockVpnService.running) {
                      toast("الحماية متوقفة بالفعل")
                      return
                  }
                  confirm(
                      "إيقاف الحماية مؤقتًا؟",
                      "ستتوقف الحماية مؤقتًا وتعود تلقائيًا عند فتح القفل القادم. هل أنت متأكد؟",
                      "نعم، أوقف مؤقتًا"
                  ) {
                      // Stop = pause until the next unlock / boot / Start (same behaviour as before)
                      Prefs.setPaused(this, true)
                      startService(Intent(this, BlockVpnService::class.java).setAction(BlockVpnService.ACTION_STOP))
                      h.postDelayed({ current?.refresh() }, 400)
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 77) {
                      if (resultCode == RESULT_OK) launch() else pendingShield = false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (Prefs.armed(this)) WatcherService.start(this, "ensure")
                  h.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(tick)
              }
          }
          EOF_FILE
