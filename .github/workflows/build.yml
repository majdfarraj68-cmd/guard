          package com.example.guard

          import android.content.Context
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView

          // Shared scaffold for every page: dark gradient, scrolling content, staggered entrance animation.
          abstract class ScrollPage(protected val a: MainActivity) : Page {
              protected val c: Context = a
              protected val content: LinearLayout = LinearLayout(a)
              private val scroll: ScrollView = ScrollView(a)

              override val root: View
                  get() = scroll

              init {
                  scroll.background = T.screenBg()
                  scroll.isFillViewport = true
                  scroll.isVerticalScrollBarEnabled = false
                  content.orientation = LinearLayout.VERTICAL
                  content.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  content.setPadding(T.dp(a, 20), T.dp(a, 40), T.dp(a, 20), T.dp(a, 24))
                  scroll.addView(content, FrameLayout.LayoutParams(T.MATCH, T.WRAP))
              }

              protected fun add(v: View, top: Int = 14) {
                  content.addView(v, T.lpd(c, T.MATCH, T.WRAP, 0, top, 0, 0))
              }

              protected fun header(title: String, sub: String): View {
                  val v = T.vbox(c)
                  v.addView(T.text(c, title, 26f, T.TEXT, true))
                  if (sub.isNotEmpty()) v.addView(T.text(c, sub, 13f, T.SUB), T.lpd(c, T.WRAP, T.WRAP, 0, 2, 0, 0))
                  return v
              }

              override fun onShown() {
                  for (i in 0 until content.childCount) {
                      val v = content.getChildAt(i)
                      v.alpha = 0f
                      v.translationY = T.dp(c, 18).toFloat()
                      v.animate().alpha(1f).translationY(0f).setStartDelay(60L * i).setDuration(320)
                          .setInterpolator(DecelerateInterpolator()).start()
                  }
              }

              override fun onHidden() {}
          }
