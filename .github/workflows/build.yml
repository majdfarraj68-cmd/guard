name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project and build
        run: |
          set -e
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Guard"
          include(":app")
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.guard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 21
                  versionName = "21"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("fixed.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <package android:name="com.google.android.youtube" />
              </queries>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".WatcherService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Keeps the local VPN protection armed and re-enables it when the phone is unlocked" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">ثبات</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/AchievementsPage.kt <<'EOF_FILE'
          package com.example.guard

          import android.app.AlertDialog
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.time.LocalDate
          import java.time.YearMonth
          import java.time.format.DateTimeFormatter
          import java.util.Locale

          // "إنجازاتي": statistics, last-7-days activity, badges and the achievements calendar (full history).
          class AchievementsPage(a: MainActivity) : ScrollPage(a) {
              private val body: LinearLayout = T.vbox(a)
              private var ym: YearMonth = YearMonth.now()
              private var sig = ""

              init {
                  add(header("إنجازاتي", "كل ما بنيته محفوظ"), 0)
                  add(body, 0)
              }

              private fun tile(label: String, value: String, tint: Int): View {
                  val box = T.cardBox(c, 20, 16)
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.addView(T.text(c, value, 26f, T.TEXT, true))
                  box.addView(T.text(c, label, 12.5f, tint, true), T.lpd(c, T.WRAP, T.WRAP, 0, 2, 0, 0))
                  return box
              }

              private fun statsGrid(s: GameStore.Snapshot): View {
                  val box = T.vbox(c)
                  val items = listOf(
                      Triple("أيام الالتزام", s.totalSuccess.toString(), T.GREEN),
                      Triple("أفضل سلسلة", s.best.toString(), T.BLUE),
                      Triple("السلسلة الحالية", s.cur.toString(), T.AMBER),
                      Triple("الشارات", s.earned.size.toString() + "/" + GameMath.BADGES.size, T.AMBER),
                      Triple("المستوى الحالي", s.level.toString(), T.GREEN),
                      Triple("مجموع XP", s.xp.toString(), T.BLUE)
                  )
                  var i = 0
                  while (i < items.size) {
                      val row = T.hbox(c)
                      for (j in 0 until 2) {
                          val item = items[i + j]
                          row.addView(tile(item.first, item.second, item.third), LinearLayout.LayoutParams(0, T.WRAP, 1f))
                          if (j == 0) row.addView(T.space(c, 12, 1))
                      }
                      box.addView(row, T.lpd(c, T.MATCH, T.WRAP, 0, if (i == 0) 0 else 12, 0, 0))
                      i += 2
                  }
                  return box
              }

              private fun weekChart(today: Long, masks: Map<Long, Int>, log: Map<Long, Int>, jd: Set<Long>): View {
                  val card = T.cardBox(c)
                  card.addView(T.text(c, "نشاط آخر 7 أيام (XP)", 16f, T.TEXT, true))
                  val xps = IntArray(7)
                  var mx = 0
                  for (i in 0 until 7) {
                      xps[i] = GameMath.dayXpFor(today - 6 + i, masks, log, jd)
                      if (xps[i] > mx) mx = xps[i]
                  }
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.BOTTOM
                  val maxH = T.dp(c, 70)
                  for (i in 0 until 7) {
                      val col = T.vbox(c)
                      col.gravity = Gravity.CENTER_HORIZONTAL
                      val h = if (mx == 0) T.dp(c, 4) else maxOf(T.dp(c, 4), xps[i] * maxH / mx)
                      val bar = View(c)
                      bar.background = T.grad(c, T.GREEN_D, T.GREEN, 6)
                      col.addView(bar, LinearLayout.LayoutParams(T.dp(c, 16), h))
                      col.addView(T.text(c, LocalDate.ofEpochDay(today - 6 + i).dayOfMonth.toString(), 11f, T.MUTED), T.lpd(c, T.WRAP, T.WRAP, 0, 6, 0, 0))
                      row.addView(col, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  }
                  card.addView(row, T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  return card
              }

              private fun badgeTile(id: String, earned: Boolean): View {
                  val box = T.vbox(c)
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  val ic = T.iconBubble(c, if (earned) IconView.MEDAL else IconView.LOCK, if (earned) T.AMBER else T.MUTED, 52)
                  box.addView(ic, LinearLayout.LayoutParams(T.dp(c, 52), T.dp(c, 52)))
                  val title = T.text(c, Msgs.badgeTitle(id), 12f, if (earned) T.TEXT else T.MUTED, true)
                  title.gravity = Gravity.CENTER
                  box.addView(title, T.lpd(c, T.MATCH, T.WRAP, 0, 6, 0, 0))
                  box.setOnClickListener {
                      AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(Msgs.badgeTitle(id))
                          .setMessage(Msgs.badgeDesc(id) + "\n\n" + (if (earned) "حصلت عليها، وهي لك للأبد." else "لم تحصل عليها بعد. تقدّم خطوة خطوة."))
                          .setPositiveButton("حسنًا", null)
                          .show()
                  }
                  T.pressable(box)
                  return box
              }

              private fun badgesCard(s: GameStore.Snapshot): View {
                  val card = T.cardBox(c)
                  card.addView(T.text(c, "الشارات", 16f, T.TEXT, true))
                  val ids = GameMath.BADGES
                  var i = 0
                  while (i < ids.size) {
                      val row = T.hbox(c)
                      for (j in 0 until 3) {
                          if (i + j < ids.size) {
                              row.addView(badgeTile(ids[i + j], s.earned.contains(ids[i + j])), LinearLayout.LayoutParams(0, T.WRAP, 1f))
                          } else {
                              row.addView(T.space(c, 1, 1), LinearLayout.LayoutParams(0, 1, 1f))
                          }
                      }
                      card.addView(row, T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                      i += 3
                  }
                  return card
              }

              private fun legend(color: Int, label: String): View {
                  val r = T.hbox(c)
                  val dot = View(c)
                  dot.background = T.oval(color)
                  r.addView(dot, LinearLayout.LayoutParams(T.dp(c, 10), T.dp(c, 10)))
                  r.addView(T.space(c, 6, 1))
                  r.addView(T.text(c, label, 12f, T.SUB))
                  return r
              }

              private fun cell(day: Long, st: Int?, perfect: Boolean, isToday: Boolean, future: Boolean): View {
                  val f = FrameLayout(c)
                  val size = T.dp(c, 36)
                  val tv = T.text(c, LocalDate.ofEpochDay(day).dayOfMonth.toString(), 13f, if (future) T.MUTED else T.SUB)
                  tv.gravity = Gravity.CENTER
                  var fill = 0x14FFFFFF
                  var tc = if (future) T.MUTED else T.SUB
                  var edge = 0
                  if (st == 1) {
                      fill = 0xFF1FBF86.toInt()
                      tc = T.ON_GREEN
                      if (perfect) edge = T.AMBER
                  } else if (st == 2) {
                      fill = 0x33FFB74D
                      tc = T.AMBER
                      edge = T.AMBER
                  }
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(fill)
                  if (isToday) g.setStroke(T.dp(c, 2), T.BLUE) else if (edge != 0) g.setStroke(T.dp(c, 2), edge)
                  tv.background = g
                  tv.setTextColor(tc)
                  f.addView(tv, FrameLayout.LayoutParams(size, size, Gravity.CENTER))
                  if (!future) f.setOnClickListener { editDay(day) }
                  return f
              }

              private fun editDay(day: Long) {
                  val title = LocalDate.ofEpochDay(day).format(DateTimeFormatter.ofPattern("EEEE d MMMM", Locale("ar")))
                  AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(title)
                      .setItems(arrayOf("نجحت", "تعثّرت", "غير مسجل")) { _, which ->
                          val st = if (which == 0) 1 else if (which == 1) 2 else 0
                          StreakStore.set(c, day, st)
                          sig = ""
                          refresh()
                          a.afterChange()
                      }
                      .show()
              }

              private fun calendarCard(today: Long, log: Map<Long, Int>, masks: Map<Long, Int>): View {
                  val card = T.cardBox(c)
                  val nav = T.hbox(c)
                  nav.addView(T.roundIcon(c, IconView.BACK) {
                      ym = ym.minusMonths(1)
                      sig = ""
                      refresh()
                  }, LinearLayout.LayoutParams(T.dp(c, 40), T.dp(c, 40)))
                  val title = T.text(c, ym.format(DateTimeFormatter.ofPattern("MMMM yyyy", Locale("ar"))), 16f, T.TEXT, true)
                  title.gravity = Gravity.CENTER
                  nav.addView(title, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  nav.addView(T.roundIcon(c, IconView.CHEVRON) {
                      ym = ym.plusMonths(1)
                      sig = ""
                      refresh()
                  }, LinearLayout.LayoutParams(T.dp(c, 40), T.dp(c, 40)))
                  card.addView(nav)

                  val lg = T.hbox(c)
                  lg.addView(legend(0xFF1FBF86.toInt(), "التزام"))
                  lg.addView(T.space(c, 14, 1))
                  lg.addView(legend(T.AMBER, "تعثّر"))
                  lg.addView(T.space(c, 14, 1))
                  lg.addView(legend(0x33FFFFFF, "غير مسجل"))
                  card.addView(lg, T.lpd(c, T.WRAP, T.WRAP, 0, 12, 0, 8))

                  val names = listOf("س", "ح", "ن", "ث", "ر", "خ", "ج")
                  val head = LinearLayout(c)
                  head.orientation = LinearLayout.HORIZONTAL
                  for (n in names) {
                      val tv = T.text(c, n, 12f, T.MUTED, true)
                      tv.gravity = Gravity.CENTER
                      head.addView(tv, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  }
                  card.addView(head, T.lpd(c, T.MATCH, T.WRAP, 0, 4, 0, 4))

                  val offset = (ym.atDay(1).dayOfWeek.value + 1) % 7
                  val len = ym.lengthOfMonth()
                  for (row in 0 until 6) {
                      if (row * 7 - offset + 1 > len) break
                      val r = LinearLayout(c)
                      r.orientation = LinearLayout.HORIZONTAL
                      for (col in 0 until 7) {
                          val n = row * 7 + col - offset + 1
                          if (n < 1 || n > len) {
                              r.addView(T.space(c, 1, 1), LinearLayout.LayoutParams(0, T.dp(c, 42), 1f))
                          } else {
                              val day = ym.atDay(n).toEpochDay()
                              val st: Int? = log[day]
                              val perfect = st == 1 && GameMath.questsDone(masks[day] ?: 0) == GameMath.QUESTS
                              r.addView(cell(day, st, perfect, day == today, day > today), LinearLayout.LayoutParams(0, T.dp(c, 42), 1f))
                          }
                      }
                      card.addView(r)
                  }
                  card.addView(T.text(c, "اضغط على أي يوم لتعديل تسجيله. الإطار الذهبي = يوم مثالي.", 12f, T.MUTED), T.lpd(c, T.WRAP, T.WRAP, 0, 10, 0, 0))
                  return card
              }

              override fun refresh() {
                  val today = StreakStore.today()
                  val log = StreakStore.load(c)
                  val masks = GameStore.questMasks(c)
                  val jd = GameStore.journalDays(c)
                  val ms = masks.keys.sorted().joinToString(",") { it.toString() + ":" + masks[it] }
                  val s = StreakMath.serialize(log) + "#" + ms + "#" + jd.size + "#" + today + "#" + ym
                  if (s == sig) return
                  sig = s
                  body.removeAllViews()
                  val snap = GameStore.snapshot(c)
                  body.addView(statsGrid(snap), T.lpd(c, T.MATCH, T.WRAP, 0, 16, 0, 0))
                  body.addView(weekChart(today, masks, log, jd), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  body.addView(badgesCard(snap), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  body.addView(calendarCard(today, log, masks), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
              }

              override fun onShown() {
                  super.onShown()
                  sig = ""
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BarView.kt <<'EOF_FILE'
          package com.example.guard

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View

          // Rounded progress bar that fills from the right (RTL) with a smooth animation.
          class BarView(c: Context) : View(c) {
              var fraction: Float = 0f
                  set(value) {
                      field = if (value < 0f) 0f else if (value > 1f) 1f else value
                      invalidate()
                  }

              private val track = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val r = RectF()

              init {
                  track.color = 0x22FFFFFF
              }

              fun animateTo(f: Float) {
                  val a = ValueAnimator.ofFloat(fraction, f)
                  a.duration = 650
                  a.addUpdateListener { fraction = it.animatedValue as Float }
                  a.start()
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val rad = h / 2f
                  r.set(0f, 0f, w, h)
                  canvas.drawRoundRect(r, rad, rad, track)
                  val fw = w * fraction
                  if (fw > 0f) {
                      fill.shader = LinearGradient(w - fw, 0f, w, 0f, T.GREEN, T.GREEN_D, Shader.TileMode.CLAMP)
                      r.set(w - fw, 0f, w, h)
                      canvas.drawRoundRect(r, rad, rad, fill)
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BlockVpnService.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream

          // A local VPN that captures ONLY the YouTube app's traffic and drops it,
          // so the YouTube app has no internet while protection is on.
          class BlockVpnService : VpnService() {
              private var tun: ParcelFileDescriptor? = null
              private var reader: Thread? = null

              companion object {
                  @Volatile var running = false
                  const val ACTION_STOP = "com.example.guard.STOP"
                  const val YT = "com.google.android.youtube"
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopVpn()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startVpn()
                  return START_STICKY
              }

              @Synchronized
              private fun startVpn() {
                  if (tun != null) return
                  try {
                      val pfd = Builder()
                          .setSession("حارس")
                          .setBlocking(true)
                          .addAddress("10.77.0.1", 32)
                          .addRoute("0.0.0.0", 0)
                          .addAddress("fd00:77::1", 128)
                          .addRoute("::", 0)
                          .addAllowedApplication(YT)
                          .establish()
                      if (pfd == null) {
                          Prefs.setDbg(this, "err", "establish returned null")
                          return
                      }
                      tun = pfd
                      running = true
                      Prefs.setDbg(this, "err", "")
                      reader = Thread {
                          val input = FileInputStream(pfd.fileDescriptor)
                          val buf = ByteArray(32767)
                          try { while (input.read(buf) >= 0) { /* drop everything */ } } catch (_: Exception) {}
                      }.also { it.isDaemon = true; it.start() }
                  } catch (t: Throwable) {
                      running = false
                      Prefs.setDbg(this, "err", t.toString())
                  }
              }

              @Synchronized
              private fun stopVpn() {
                  running = false
                  try { tun?.close() } catch (_: Exception) {}
                  tun = null
                  reader?.interrupt()
                  reader = null
              }

              override fun onRevoke() {
                  stopVpn()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  stopVpn()
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BootReceiver.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          // Runs after the first unlock following a reboot (and after an app update).
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      Intent.ACTION_BOOT_COMPLETED,
                      Intent.ACTION_MY_PACKAGE_REPLACED,
                      "android.intent.action.QUICKBOOT_POWERON" -> WatcherService.start(context, "boot")
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/GameMath.java <<'EOF_FILE'
          package com.example.guard;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          /**
           * Pure game rules (no Android dependencies, unit-tested).
           * XP is derived from the saved history, so it can be recomputed at any time.
           * Nothing here ever removes a level, region or badge: the app keeps high-water marks on top of it.
           */
          public final class GameMath {
              public static final int QUEST_XP = 20;
              public static final int SUCCESS_XP = 30;
              public static final int JOURNAL_XP = 15;
              public static final int QUESTS = 3;

              private static final int[] REGION_LEVELS = {1, 3, 5, 8, 12, 16};
              private static final int[] STREAK_MILESTONES = {3, 7, 14, 30};
              private static final int[] STREAK_BONUS = {25, 75, 150, 300};

              public static final String[] BADGES = {"s1", "s3", "s7", "s14", "s30", "j1", "j7", "p1", "p7", "c3", "t10", "l5", "l10"};

              private GameMath() {}

              /** Total XP needed to reach level n (level 1 = 0, 2 = 100, 3 = 300, 4 = 600, 5 = 1000 ...). */
              public static int xpForLevel(int n) {
                  return n <= 1 ? 0 : 50 * n * (n - 1);
              }

              public static int levelForXp(int xp) {
                  int n = 1;
                  while (xpForLevel(n + 1) <= xp) n++;
                  return n;
              }

              public static int regionCount() { return REGION_LEVELS.length; }

              public static int regionLevel(int i) { return REGION_LEVELS[i]; }

              public static int regionsUnlocked(int level) {
                  int n = 0;
                  for (int l : REGION_LEVELS) if (level >= l) n++;
                  return n;
              }

              public static int questsDone(int mask) { return Integer.bitCount(mask & 7); }

              public static int dayXp(int mask, boolean success, boolean journal) {
                  return questsDone(mask) * QUEST_XP + (success ? SUCCESS_XP : 0) + (journal ? JOURNAL_XP : 0);
              }

              public static int streakBonus(int best) {
                  int sum = 0;
                  for (int i = 0; i < STREAK_MILESTONES.length; i++) {
                      if (best >= STREAK_MILESTONES[i]) sum += STREAK_BONUS[i];
                  }
                  return sum;
              }

              private static boolean isSuccess(Map<Long, Integer> log, long d) {
                  Integer s = log.get(Long.valueOf(d));
                  return s != null && s.intValue() == StreakMath.SUCCESS;
              }

              private static int maskOf(Map<Long, Integer> masks, long d) {
                  Integer m = masks.get(Long.valueOf(d));
                  return m == null ? 0 : m.intValue();
              }

              public static int dayXpFor(long day, Map<Long, Integer> masks, Map<Long, Integer> log, Set<Long> journal) {
                  return dayXp(maskOf(masks, day), isSuccess(log, day), journal.contains(Long.valueOf(day)));
              }

              /** Quests earn XP on any day (even a day with a stumble); a success check-in adds a bonus. */
              public static int totalXp(Map<Long, Integer> masks, Map<Long, Integer> log, Set<Long> journal, int bestStreak) {
                  HashSet<Long> days = new HashSet<Long>();
                  days.addAll(masks.keySet());
                  days.addAll(log.keySet());
                  days.addAll(journal);
                  int xp = 0;
                  for (Long d : days) xp += dayXpFor(d.longValue(), masks, log, journal);
                  return xp + streakBonus(bestStreak);
              }

              /** A perfect day = all three quests done + a success check-in. */
              public static int perfectDays(Map<Long, Integer> masks, Map<Long, Integer> log) {
                  int n = 0;
                  for (Map.Entry<Long, Integer> e : masks.entrySet()) {
                      long d = e.getKey().longValue();
                      if (questsDone(e.getValue().intValue()) == QUESTS && isSuccess(log, d)) n++;
                  }
                  return n;
              }

              /** A comeback = a stumble followed by three successful days in a row. */
              public static boolean comeback(Map<Long, Integer> log) {
                  for (Map.Entry<Long, Integer> e : log.entrySet()) {
                      if (e.getValue().intValue() == StreakMath.RELAPSE) {
                          long d = e.getKey().longValue();
                          if (isSuccess(log, d + 1) && isSuccess(log, d + 2) && isSuccess(log, d + 3)) return true;
                      }
                  }
                  return false;
              }

              public static final class Stats {
                  public int bestStreak;
                  public int totalSuccess;
                  public int journalDays;
                  public int perfectDays;
                  public int level;
                  public boolean comeback;
              }

              public static boolean earned(String id, Stats s) {
                  if ("s1".equals(id)) return s.bestStreak >= 1;
                  if ("s3".equals(id)) return s.bestStreak >= 3;
                  if ("s7".equals(id)) return s.bestStreak >= 7;
                  if ("s14".equals(id)) return s.bestStreak >= 14;
                  if ("s30".equals(id)) return s.bestStreak >= 30;
                  if ("j1".equals(id)) return s.journalDays >= 1;
                  if ("j7".equals(id)) return s.journalDays >= 7;
                  if ("p1".equals(id)) return s.perfectDays >= 1;
                  if ("p7".equals(id)) return s.perfectDays >= 7;
                  if ("c3".equals(id)) return s.comeback;
                  if ("t10".equals(id)) return s.totalSuccess >= 10;
                  if ("l5".equals(id)) return s.level >= 5;
                  if ("l10".equals(id)) return s.level >= 10;
                  return false;
              }

              public static List<String> earnedList(Stats s) {
                  ArrayList<String> out = new ArrayList<String>();
                  for (String id : BADGES) if (earned(id, s)) out.add(id);
                  return out;
              }
          }
