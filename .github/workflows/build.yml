                  slipBtn.setOnClickListener { choose(2) }
                  btns.addView(okBtn, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  btns.addView(T.space(c, 10, 1))
                  btns.addView(slipBtn, LinearLayout.LayoutParams(0, T.WRAP, 1f))
