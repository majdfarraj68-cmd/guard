          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">حارس</string>
              <string name="service_desc">يراقب فتح يوتيوب ويعرض سؤال التأكيد قبل الدخول.</string>
          </resources>
