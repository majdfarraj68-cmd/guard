          package com.example.guard

          import android.content.Context
          import android.graphics.Outline
          import android.view.Gravity
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView

          // "عالمي": the user's world, level/XP, streak stats, unlocked regions and today's quest progress.
          class HomePage(a: MainActivity) : ScrollPage(a) {
              private class Tile(val view: View, val num: TextView)

              private lateinit var world: WorldView
              private lateinit var levelChip: TextView
              private lateinit var regionCap: TextView
              private lateinit var lvlTitle: TextView
              private lateinit var xpText: TextView
              private lateinit var xpBar: BarView
              private lateinit var curTv: TextView
              private lateinit var bestTv: TextView
              private lateinit var badgeTv: TextView
              private lateinit var regions: LinearLayout
              private lateinit var questText: TextView
              private lateinit var questBar: BarView
              private var lastCur = 0
              private var lastBest = 0
              private var lastFrac = -1f
              private var lastQuests = -1
              private var regLevel = -1

              init {
                  build()
              }

              private fun build() {
                  val bar = T.hbox(c)
                  val titles = T.vbox(c)
                  titles.addView(T.text(c, "ثبات", 30f, T.TEXT, true))
                  titles.addView(T.text(c, "ابنِ نسختك الأقوى", 13f, T.SUB))
                  bar.addView(titles, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  bar.addView(T.roundIcon(c, IconView.SLIDERS) { a.goSettings() }, LinearLayout.LayoutParams(T.dp(c, 44), T.dp(c, 44)))
                  content.addView(bar, T.lpd(c, T.MATCH, T.WRAP))

                  content.addView(worldCard(), T.lpd(c, T.MATCH, T.dp(c, 240), 0, 18, 0, 0))
                  add(xpCard())
                  add(statsRow())
                  add(regionsCard())
                  add(todayCard())
              }

              private fun worldCard(): View {
                  val f = FrameLayout(c)
                  world = WorldView(c)
                  f.addView(world, FrameLayout.LayoutParams(T.MATCH, T.MATCH))
                  val radius = T.dp(c, 26).toFloat()
                  f.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setRoundRect(0, 0, view.width, view.height, radius)
                      }
                  }
                  f.clipToOutline = true
                  levelChip = T.pill(c, "المستوى 1", T.GREEN)
                  val lp1 = FrameLayout.LayoutParams(T.WRAP, T.WRAP, Gravity.TOP or Gravity.START)
                  lp1.setMargins(T.dp(c, 12), T.dp(c, 12), T.dp(c, 12), 0)
                  f.addView(levelChip, lp1)
                  regionCap = T.pill(c, "", T.TEXT)
                  val lp2 = FrameLayout.LayoutParams(T.WRAP, T.WRAP, Gravity.BOTTOM or Gravity.START)
                  lp2.setMargins(T.dp(c, 12), 0, T.dp(c, 12), T.dp(c, 12))
                  f.addView(regionCap, lp2)
                  return f
              }

              private fun xpCard(): View {
                  val box = T.cardBox(c)
                  val row = T.hbox(c)
                  lvlTitle = T.text(c, "", 18f, T.TEXT, true)
                  row.addView(lvlTitle, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  xpText = T.text(c, "", 13f, T.SUB)
                  row.addView(xpText)
                  box.addView(row)
                  xpBar = BarView(c)
                  box.addView(xpBar, T.lpd(c, T.MATCH, T.dp(c, 12), 0, 12, 0, 0))
                  return box
              }

              private fun tile(kind: Int, tint: Int, label: String): Tile {
                  val box = T.cardBox(c, 20, 14)
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.addView(IconView(c, kind, tint), LinearLayout.LayoutParams(T.dp(c, 24), T.dp(c, 24)))
                  val num = T.text(c, "0", 26f, T.TEXT, true)
                  box.addView(num, T.lpd(c, T.WRAP, T.WRAP, 0, 6, 0, 0))
                  box.addView(T.text(c, label, 12f, tint, true))
                  return Tile(box, num)
              }

              private fun statsRow(): View {
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  val cur = tile(IconView.FLAME, T.AMBER, "السلسلة")
                  val best = tile(IconView.STAR, T.BLUE, "أفضل سلسلة")
                  val badges = tile(IconView.MEDAL, T.GREEN, "الشارات")
                  curTv = cur.num
                  bestTv = best.num
                  badgeTv = badges.num
                  row.addView(cur.view, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  row.addView(T.space(c, 10, 1))
                  row.addView(best.view, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  row.addView(T.space(c, 10, 1))
                  row.addView(badges.view, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  return row
              }

              private fun regionsCard(): View {
                  val box = T.cardBox(c)
                  box.addView(T.text(c, "مناطق عالمك", 16f, T.TEXT, true))
                  val hs = HorizontalScrollView(c)
                  hs.isHorizontalScrollBarEnabled = false
                  regions = LinearLayout(c)
                  regions.orientation = LinearLayout.HORIZONTAL
                  hs.addView(regions)
                  box.addView(hs, T.lpd(c, T.MATCH, T.WRAP, 0, 12, 0, 0))
                  return box
              }

              private fun todayCard(): View {
                  val box = T.cardBox(c)
                  val row = T.hbox(c)
                  row.addView(T.text(c, "مهمات اليوم", 16f, T.TEXT, true), LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  questText = T.text(c, "", 13f, T.SUB)
                  row.addView(questText)
                  box.addView(row)
                  questBar = BarView(c)
                  box.addView(questBar, T.lpd(c, T.MATCH, T.dp(c, 12), 0, 12, 0, 0))
                  val btn = T.button(c, "افتح مهمات اليوم", T.grad(c, T.GREEN_D, T.GREEN, 18), T.ON_GREEN)
                  btn.setOnClickListener { a.goTab(1) }
                  box.addView(btn, T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  return box
              }

              private fun buildRegions(lvl: Int) {
                  regions.removeAllViews()
                  for (i in 0 until GameMath.regionCount()) {
                      val unlocked = lvl >= GameMath.regionLevel(i)
                      val chip = T.hbox(c)
                      chip.background = T.card(c, 18, if (unlocked) 0x1F2EE59D else 0x0FFFFFFF, if (unlocked) 0x552EE59D else 0x1FFFFFFF)
                      chip.setPadding(T.dp(c, 12), T.dp(c, 10), T.dp(c, 14), T.dp(c, 10))
                      chip.addView(IconView(c, if (unlocked) IconView.CHECK else IconView.LOCK, if (unlocked) T.GREEN else T.MUTED),
                          LinearLayout.LayoutParams(T.dp(c, 18), T.dp(c, 18)))
                      chip.addView(T.space(c, 8, 1))
                      val tx = T.vbox(c)
                      tx.addView(T.text(c, Msgs.regionName(i), 13.5f, if (unlocked) T.TEXT else T.MUTED, true))
                      if (!unlocked) tx.addView(T.text(c, "يُفتح عند المستوى " + GameMath.regionLevel(i), 11f, T.MUTED))
                      chip.addView(tx)
                      regions.addView(chip, T.lpd(c, T.WRAP, T.WRAP, 0, 0, 10, 0))
                  }
              }

              override fun refresh() {
                  val s = GameStore.snapshot(c)
                  val lvl = s.level
                  world.level = lvl
                  levelChip.text = "المستوى " + lvl
                  regionCap.text = Msgs.regionName(GameMath.regionsUnlocked(lvl) - 1)
                  lvlTitle.text = "المستوى " + lvl + " · " + Msgs.levelTitle(lvl)
                  val base = GameMath.xpForLevel(lvl)
                  val span = GameMath.xpForLevel(lvl + 1) - base
                  val gained = s.xp - base
                  xpText.text = gained.toString() + " / " + span + " XP"
                  val frac = gained.toFloat() / span.toFloat()
                  if (frac != lastFrac) {
                      xpBar.animateTo(frac)
                      lastFrac = frac
                  }
                  if (s.cur != lastCur) {
                      T.countTo(curTv, lastCur, s.cur)
                      lastCur = s.cur
                  }
                  if (s.best != lastBest) {
                      T.countTo(bestTv, lastBest, s.best)
                      lastBest = s.best
                  }
                  badgeTv.text = s.earned.size.toString() + "/" + GameMath.BADGES.size
                  if (lvl != regLevel) {
                      regLevel = lvl
                      buildRegions(lvl)
                  }
                  val done = GameMath.questsDone(GameStore.mask(c, StreakStore.today()))
                  if (done != lastQuests) {
                      lastQuests = done
                      questText.text = done.toString() + " من " + GameMath.QUESTS
                      questBar.animateTo(done.toFloat() / GameMath.QUESTS.toFloat())
                  }
              }

              override fun onShown() {
                  super.onShown()
                  lastFrac = -1f
                  lastQuests = -1
              }
          }
