          package com.example.guard;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.TreeMap;

          /**
           * Pure streak logic (no Android dependencies, so it can be unit-tested anywhere).
           * Days are epoch-day numbers. A day is SUCCESS, RELAPSE, or simply absent (= not logged).
           * An unlogged day is neither a success nor a relapse: it never counts, but it is not a failure either.
           */
          public final class StreakMath {
              public static final int SUCCESS = 1;
              public static final int RELAPSE = 2;

              private StreakMath() {}

              private static boolean isSuccess(Map<Long, Integer> log, long day) {
                  Integer s = log.get(day);
                  return s != null && s.intValue() == SUCCESS;
              }

              /**
               * Current streak = consecutive SUCCESS days ending today.
               * If today is not logged yet the streak is counted back from yesterday (today is still pending),
               * if today is a relapse the streak is 0.
               */
              public static int current(Map<Long, Integer> log, long today) {
                  long d = today;
                  Integer t = log.get(today);
                  if (t == null) {
                      d = today - 1;
                  } else if (t.intValue() != SUCCESS) {
                      return 0;
                  }
                  int n = 0;
                  while (isSuccess(log, d)) {
                      n++;
                      d--;
                  }
                  return n;
              }

              /** Longest run of consecutive SUCCESS days in the whole history. Relapses never reduce it. */
              public static int best(Map<Long, Integer> log) {
                  TreeMap<Long, Integer> sorted = new TreeMap<Long, Integer>(log);
                  int best = 0;
                  int run = 0;
                  Long prevSuccess = null;
                  for (Map.Entry<Long, Integer> e : sorted.entrySet()) {
                      long k = e.getKey().longValue();
                      if (e.getValue().intValue() == SUCCESS) {
                          if (prevSuccess != null && k == prevSuccess.longValue() + 1) {
                              run++;
                          } else {
                              run = 1;
                          }
                          prevSuccess = Long.valueOf(k);
                          if (run > best) best = run;
                      } else {
                          prevSuccess = null;
                          run = 0;
                      }
                  }
                  return best;
              }

              /** Best streak computed without one day (used to keep a high-water mark that ignores today's pending entry). */
              public static int bestExcluding(Map<Long, Integer> log, long day) {
                  HashMap<Long, Integer> copy = new HashMap<Long, Integer>(log);
                  copy.remove(Long.valueOf(day));
                  return best(copy);
              }

              public static int count(Map<Long, Integer> log, int status) {
                  int n = 0;
                  for (Integer v : log.values()) {
                      if (v != null && v.intValue() == status) n++;
                  }
                  return n;
              }

              public static String serialize(Map<Long, Integer> log) {
                  TreeMap<Long, Integer> sorted = new TreeMap<Long, Integer>(log);
                  StringBuilder sb = new StringBuilder();
                  for (Map.Entry<Long, Integer> e : sorted.entrySet()) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(e.getKey()).append(':').append(e.getValue());
                  }
                  return sb.toString();
              }

              public static Map<Long, Integer> parse(String s) {
                  HashMap<Long, Integer> m = new HashMap<Long, Integer>();
                  if (s == null || s.isEmpty()) return m;
                  for (String part : s.split(",")) {
                      String[] kv = part.split(":");
                      if (kv.length != 2) continue;
                      try {
                          long day = Long.parseLong(kv[0].trim());
                          int st = Integer.parseInt(kv[1].trim());
                          if (st == SUCCESS || st == RELAPSE) m.put(Long.valueOf(day), Integer.valueOf(st));
                      } catch (NumberFormatException ignored) {
                          // skip damaged entries instead of losing the whole log
                      }
                  }
                  return m;
              }
          }
