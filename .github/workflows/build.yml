          package com.example.guard

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import android.view.animation.LinearInterpolator

          // The user's world, drawn in code. It starts as a small island and grows with the level:
          // forest (L3), lake (L5), mountains (L8), castle (L12), city (L16). Locked regions stay as faint outlines.
          class WorldView(c: Context) : View(c) {
              var level: Int = 1
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val d = c.resources.displayMetrics.density
              private var t = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val rect = RectF()
              private val starData = FloatArray(60)
              private var sky: Shader? = null
              private var ground: Shader? = null
              private var moonGlow: Shader? = null
              private var fireGlow: Shader? = null
              private var anim: ValueAnimator? = null
              private val treeX = floatArrayOf(0.06f, 0.15f, 0.24f, 0.33f, 0.40f, 0.95f, 0.10f, 0.29f, 0.62f, 0.98f, 0.20f, 0.37f)

              init {
                  val r = java.util.Random(7)
                  for (i in 0 until 20) {
                      starData[i * 3] = r.nextFloat()
                      starData[i * 3 + 1] = r.nextFloat() * 0.45f
                      starData[i * 3 + 2] = r.nextFloat()
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 9000
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener {
                      t = it.animatedValue as Float
                      invalidate()
                  }
                  a.start()
                  anim = a
              }

              override fun onDetachedFromWindow() {
                  anim?.cancel()
                  anim = null
                  super.onDetachedFromWindow()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val fw = w.toFloat()
                  val fh = h.toFloat()
                  sky = LinearGradient(0f, 0f, 0f, fh, intArrayOf(0xFF0A1730.toInt(), 0xFF11405A.toInt(), 0xFF1C6E73.toInt()),
                      floatArrayOf(0f, 0.6f, 1f), Shader.TileMode.CLAMP)
                  ground = LinearGradient(0f, fh * 0.70f, 0f, fh, 0xFF22875F.toInt(), 0xFF0D4A3A.toInt(), Shader.TileMode.CLAMP)
                  moonGlow = RadialGradient(0f, 0f, fw * 0.16f, 0x55FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP)
                  fireGlow = RadialGradient(0f, 0f, fw * 0.13f, 0x66FFB347, 0x00FFB347, Shader.TileMode.CLAMP)
              }

              private fun tree(cv: Canvas, x: Float, base: Float, size: Float, col: Int, w: Float) {
                  p.color = if (col == 0) 0x12FFFFFF else 0xFF5B3A29.toInt()
                  cv.drawRect(x - 0.006f * w, base - size * 0.18f, x + 0.006f * w, base, p)
                  p.color = if (col == 0) 0x12FFFFFF else col
                  path.reset()
                  path.moveTo(x, base - size)
                  path.lineTo(x - size * 0.38f, base - size * 0.38f)
                  path.lineTo(x + size * 0.38f, base - size * 0.38f)
                  path.close()
                  cv.drawPath(path, p)
                  path.reset()
                  path.moveTo(x, base - size * 0.72f)
                  path.lineTo(x - size * 0.48f, base - size * 0.12f)
                  path.lineTo(x + size * 0.48f, base - size * 0.12f)
                  path.close()
                  cv.drawPath(path, p)
              }

              private fun flame(cv: Canvas, x: Float, y: Float, hh: Float, ww: Float, col: Int) {
                  p.color = col
                  path.reset()
                  path.moveTo(x, y - hh)
                  path.cubicTo(x + ww, y - hh * 0.45f, x + ww * 0.8f, y, x, y)
                  path.cubicTo(x - ww * 0.8f, y, x - ww, y - hh * 0.45f, x, y - hh)
                  path.close()
                  cv.drawPath(path, p)
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  val lvl = level
                  p.style = Paint.Style.FILL

                  // sky, stars, moon, clouds
                  p.shader = sky
                  canvas.drawRect(0f, 0f, w, h, p)
                  p.shader = null
                  for (i in 0 until 20) {
                      val tw = 0.5f + 0.5f * Math.sin(2.0 * Math.PI * (t + starData[i * 3 + 2])).toFloat()
                      p.color = Color.argb((60 + 150 * tw).toInt(), 255, 255, 255)
                      canvas.drawCircle(starData[i * 3] * w, starData[i * 3 + 1] * h, 1.3f * d, p)
                  }
                  canvas.save()
                  canvas.translate(w * 0.82f, h * 0.2f)
                  p.shader = moonGlow
                  canvas.drawCircle(0f, 0f, w * 0.16f, p)
                  p.shader = null
                  p.color = 0xFFF4F1DE.toInt()
                  canvas.drawCircle(0f, 0f, w * 0.04f, p)
                  canvas.restore()
                  p.color = 0x22FFFFFF
                  for (i in 0 until 3) {
                      val x = ((i * 0.45f + t * 0.25f) % 1.3f - 0.15f) * w
                      val y = h * (0.14f + 0.09f * i)
                      rect.set(x, y, x + w * 0.16f, y + h * 0.045f)
                      canvas.drawOval(rect, p)
                      rect.set(x + w * 0.04f, y - h * 0.025f, x + w * 0.12f, y + h * 0.03f)
                      canvas.drawOval(rect, p)
