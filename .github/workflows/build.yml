          package com.example.guard

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.os.SystemClock
          import java.text.SimpleDateFormat
          import java.util.Date

          object VpnController {
              @Volatile private var lastAttempt = 0L

              // Single guarded entry point for starting the VPN. Safe to call any number of times:
              //  - does nothing until first-time setup is done (armed)
              //  - "unlock" / "boot" / "start" end a Stop-pause; other reasons ("ensure", "sticky") respect it
              //  - does nothing if the VPN is already running
              //  - at most one attempt every 2 seconds
              //  - never shows UI: if VPN consent is missing it only posts a notification
              @Synchronized
              fun ensureStarted(ctx: Context, reason: String) {
                  val app = ctx.applicationContext
                  try {
                      if (!Prefs.armed(app)) return
                      if (reason == "unlock" || reason == "boot" || reason == "start") Prefs.setPaused(app, false)
                      if (Prefs.paused(app)) return
                      if (BlockVpnService.running) return
                      val now = SystemClock.elapsedRealtime()
                      if (lastAttempt != 0L && now - lastAttempt < 2000) return
                      lastAttempt = now
                      if (VpnService.prepare(app) != null) {
                          Prefs.setDbg(app, "err", "إذن VPN ناقص: افتح التطبيق واضغط Start")
                          notifyNeedsOpen(app)
                          return
                      }
                      app.startService(Intent(app, BlockVpnService::class.java))
                      Prefs.setDbg(app, "auto", SimpleDateFormat("HH:mm:ss").format(Date()) + " ($reason)")
                      Prefs.setDbg(app, "err", "")
                  } catch (t: Throwable) {
                      Prefs.setDbg(app, "err", "auto: $t")
                  }
              }

              private fun notifyNeedsOpen(c: Context) {
                  try {
                      val nm = c.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel("guard_alert", "تنبيهات حارس", NotificationManager.IMPORTANCE_DEFAULT))
                      val pi = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      val n = Notification.Builder(c, "guard_alert")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .setContentTitle("حارس")
                          .setContentText("افتح التطبيق واضغط Start لإعادة تفعيل إذن VPN")
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      nm.notify(2, n)
                  } catch (_: Throwable) {}
              }
          }
