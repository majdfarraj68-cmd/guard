                  val box = T.cardBox(c, 16, 14)
                  box.background = T.card(c, 16, 0x142EE59D, 0x222EE59D)
                  msgTv = T.text(c, "", 14.5f, T.TEXT)
                  box.addView(msgTv)
                  card.addView(box, T.lpd(c, T.MATCH, T.WRAP, 0, 12, 0, 0))
