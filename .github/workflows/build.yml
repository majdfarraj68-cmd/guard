              private fun todayCard(): View {
                  val card = LinearLayout(c)
                  card.orientation = LinearLayout.VERTICAL
                  card.background = T.card(c, 24)
                  card.setPadding(T.dp(c, 18), T.dp(c, 18), T.dp(c, 18), T.dp(c, 18))
