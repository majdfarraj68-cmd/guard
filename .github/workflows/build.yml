                  p.color = if (mtn) 0xFF1B3A52.toInt() else 0x14FFFFFF
                  path.reset()
                  path.moveTo(0f, h * 0.70f)
                  path.lineTo(w * 0.10f, h * 0.42f)
                  path.lineTo(w * 0.24f, h * 0.60f)
                  path.lineTo(w * 0.40f, h * 0.34f)
                  path.lineTo(w * 0.58f, h * 0.62f)
                  path.lineTo(w * 0.76f, h * 0.40f)
                  path.lineTo(w, h * 0.64f)
                  path.lineTo(w, h * 0.70f)
                  path.close()
                  canvas.drawPath(path, p)
                  if (mtn) {
                      p.color = 0xFFDDE8F0.toInt()
                      for (k in 0 until 3) {
                          val px = floatArrayOf(0.10f, 0.40f, 0.76f)[k] * w
                          val py = floatArrayOf(0.42f, 0.34f, 0.40f)[k] * h
                          path.reset()
                          path.moveTo(px, py)
                          path.lineTo(px - w * 0.03f, py + h * 0.07f)
                          path.lineTo(px + w * 0.03f, py + h * 0.07f)
                          path.close()
                          canvas.drawPath(path, p)
                      }
                  }

                  // castle (level 12) and city (level 16)
                  val castle = lvl >= 12
                  p.color = if (castle) 0xFF244B66.toInt() else 0x14FFFFFF
                  val cx = w * 0.20f
                  val by = h * 0.72f
                  canvas.drawRect(cx - 0.07f * w, by - 0.20f * h, cx + 0.07f * w, by, p)
                  canvas.drawRect(cx - 0.095f * w, by - 0.28f * h, cx - 0.045f * w, by, p)
                  canvas.drawRect(cx + 0.045f * w, by - 0.28f * h, cx + 0.095f * w, by, p)
                  if (castle) {
                      p.color = 0xFFFFD27A.toInt()
                      canvas.drawRect(cx - 0.012f * w, by - 0.14f * h, cx + 0.012f * w, by - 0.09f * h, p)
                      canvas.drawRect(cx - 0.08f * w, by - 0.22f * h, cx - 0.06f * w, by - 0.18f * h, p)
                      canvas.drawRect(cx + 0.06f * w, by - 0.22f * h, cx + 0.08f * w, by - 0.18f * h, p)
                  }
                  val city = lvl >= 16
                  for (i in 0 until 5) {
                      val bx = w * (0.50f + 0.055f * i)
                      val bh = h * (0.12f + 0.04f * ((i * 3) % 4))
                      p.color = if (city) 0xFF1A3C55.toInt() else 0x10FFFFFF
                      canvas.drawRect(bx, by - bh, bx + w * 0.045f, by, p)
                      if (city) {
                          p.color = 0xFFFFD27A.toInt()
                          canvas.drawRect(bx + w * 0.01f, by - bh + h * 0.02f, bx + w * 0.016f, by - bh + h * 0.035f, p)
                          canvas.drawRect(bx + w * 0.026f, by - bh + h * 0.05f, bx + w * 0.032f, by - bh + h * 0.065f, p)
                      }
                  }

                  // island ground
                  p.shader = ground
                  rect.set(-0.1f * w, h * 0.70f, 1.1f * w, h * 1.5f)
                  canvas.drawOval(rect, p)
                  p.shader = null

                  // lake (level 5)
                  val lake = lvl >= 5
                  p.color = if (lake) 0xFF3FA9D8.toInt() else 0x18FFFFFF
                  rect.set(w * 0.64f, h * 0.80f, w * 0.90f, h * 0.91f)
                  canvas.drawOval(rect, p)
                  if (lake) {
                      p.color = 0x66FFFFFF
                      for (k in 0 until 3) {
                          val sx = w * (0.67f + 0.2f * ((t * 2f + k * 0.33f) % 1f))
                          canvas.drawRect(sx, h * (0.83f + 0.02f * k), sx + w * 0.035f, h * (0.835f + 0.02f * k), p)
                      }
                  }

                  // forest (level 3): grows with the level
                  val n = if (lvl >= 3) minOf(3 + lvl, treeX.size) else 0
                  for (i in treeX.indices) {
                      val base = h * (0.80f + 0.018f * (i % 3))
                      val size = h * (0.14f + 0.03f * (i % 4))
                      if (i < n) tree(canvas, treeX[i] * w, base, size, 0xFF1F9E6B.toInt(), w)
                      else if (lvl < 3 && i < 3) tree(canvas, treeX[i] * w, base, size, 0, w)
                  }

                  // campfire (always) with glow and flicker
                  val fx = w * 0.44f
                  val fy = h * 0.84f
                  canvas.save()
                  canvas.translate(fx, fy)
                  p.shader = fireGlow
                  canvas.drawCircle(0f, 0f, w * 0.13f, p)
                  p.shader = null
                  canvas.restore()
                  val fl = 1f + 0.12f * Math.sin(2.0 * Math.PI * t * 7.0).toFloat()
                  flame(canvas, fx, fy, h * 0.13f * fl, w * 0.032f, 0xFFFF9F43.toInt())
                  flame(canvas, fx, fy, h * 0.075f * fl, w * 0.018f, 0xFFFFE08A.toInt())
                  p.color = 0xFF4B5563.toInt()
                  for (k in -1..1) {
                      rect.set(fx + k * w * 0.028f - w * 0.012f, fy - h * 0.012f, fx + k * w * 0.028f + w * 0.012f, fy + h * 0.014f)
                      canvas.drawOval(rect, p)
                  }

                  // a sapling that grows with the level
                  val sx = w * 0.56f
                  val sy = h * 0.82f
                  val sc = 0.7f + (if (lvl > 15) 15 else lvl) * 0.07f
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeWidth = 2.5f * d * sc
                  p.color = 0xFF8B5E3C.toInt()
                  canvas.drawLine(sx, sy, sx, sy - h * 0.09f * sc, p)
                  p.style = Paint.Style.FILL
                  p.color = 0xFF34D399.toInt()
                  val top = sy - h * 0.09f * sc
                  canvas.drawCircle(sx, top, w * 0.024f * sc, p)
                  canvas.drawCircle(sx - w * 0.02f * sc, top + h * 0.025f * sc, w * 0.018f * sc, p)
                  canvas.drawCircle(sx + w * 0.02f * sc, top + h * 0.025f * sc, w * 0.018f * sc, p)
              }
          }
          EOF_FILE
