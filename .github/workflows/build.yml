          package com.example.guard

          import android.content.Context
          import java.time.LocalDate

          // Persistent storage for the victory log (SharedPreferences, survives restarts and reboots).
          object StreakStore {
              private fun sp(c: Context) = c.getSharedPreferences("streak", Context.MODE_PRIVATE)

              fun today(): Long = LocalDate.now().toEpochDay()

              fun load(c: Context): MutableMap<Long, Int> {
                  val raw = sp(c).getString("log", "") ?: ""
                  val m = HashMap<Long, Int>()
                  m.putAll(StreakMath.parse(raw))
                  return m
              }

              // status: 1 = success, 2 = relapse, 0 = clear (not logged)
              fun set(c: Context, day: Long, status: Int) {
                  val m = load(c)
                  if (status == 0) m.remove(day) else m[day] = status
                  sp(c).edit().putString("log", StreakMath.serialize(m)).commit()
              }

              // Longest streak ever. The stored high-water mark only grows, so a relapse (or an
              // edit of today's entry) never removes an earlier achievement.
              fun bestEver(c: Context, m: Map<Long, Int>, today: Long): Int {
                  val s = sp(c)
                  val stored = s.getInt("best", 0)
                  val stable = StreakMath.bestExcluding(m, today)
                  val ever = if (stable > stored) stable else stored
                  if (ever != stored) s.edit().putInt("best", ever).apply()
                  val now = StreakMath.best(m)
                  return if (now > ever) now else ever
              }
          }
