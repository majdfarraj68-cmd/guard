name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project and build
        run: |
          set -e
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Guard"
          include(":app")
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.guard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 15
                  versionName = "15"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("fixed.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_card.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1FFFFFFF" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_main.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="270" android:startColor="#0F2027" android:centerColor="#203A43" android:endColor="#2C5364" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_warn.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#26FFB300" />
              <stroke android:width="1dp" android:color="#66FFB300" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_amber.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFB300" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_green.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="0" android:startColor="#11998E" android:endColor="#38EF7D" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_red.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="0" android:startColor="#CB2D3E" android:endColor="#EF473A" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">حارس</string>
              <string name="service_desc">يمنع فتح تطبيق YouTube عندما تكون الحماية مفعّلة.</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50"
              android:description="@string/service_desc" />
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BlockerService.kt <<'EOF_FILE'
          package com.example.guard

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date

          class BlockerService : AccessibilityService() {
              private var lastHome = 0L
              private var lastToast = 0L

              companion object { var instance: BlockerService? = null }

              private val msgs = listOf(
                  "YouTube ممنوع الآن 🛡️ أنت أقوى من هذه اللحظة",
                  "الحماية شغّالة 💪 ابتعد عن الجوال شوي",
                  "قرارك بيحمي احترامك لنفسك 🌿"
              )

              private fun isYt(p: String) = p == "com.google.android.youtube" || p.endsWith(".android.youtube")

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = e.packageName?.toString() ?: return
                  if (!isYt(pkg) || !Prefs.isOn(this)) return
                  val now = System.currentTimeMillis()
                  if (now - lastHome > 400) {
                      lastHome = now
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      Prefs.setDbg(this, "last", SimpleDateFormat("HH:mm:ss").format(Date()))
                  }
                  if (now - lastToast > 3000) {
                      lastToast = now
                      try { Toast.makeText(this, msgs.random(), Toast.LENGTH_SHORT).show() } catch (_: Throwable) {}
                  }
              }

              override fun onInterrupt() {}
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/MainActivity.kt <<'EOF_FILE'
          package com.example.guard

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var statusTitle: TextView
              private lateinit var statusSub: TextView
              private lateinit var toggle: TextView
              private lateinit var warnCard: LinearLayout
              private lateinit var lastTxt: TextView
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable { override fun run() { refresh(); h.postDelayed(this, 1500) } }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val c: Context = this
                  window.statusBarColor = 0xFF0F2027.toInt()
                  window.navigationBarColor = 0xFF2C5364.toInt()

                  val col = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setPadding(Ui.dp(c, 24), Ui.dp(c, 64), Ui.dp(c, 24), Ui.dp(c, 32))
                  }
                  col.addView(Ui.label(c, "🛡️", 72f))
                  col.addView(Ui.label(c, "حارس", 34f, bold = true))
                  col.addView(Ui.label(c, "درعك في لحظات الضعف", 15f, Ui.GRAY))
                  col.addView(Ui.space(c, 32))

                  val card = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_card)
                      setPadding(Ui.dp(c, 20), Ui.dp(c, 28), Ui.dp(c, 20), Ui.dp(c, 28))
                  }
                  statusTitle = Ui.label(c, "", 24f, bold = true)
                  statusSub = Ui.label(c, "", 15f, Ui.GRAY)
                  card.addView(statusTitle)
                  card.addView(Ui.space(c, 6))
                  card.addView(statusSub)
                  col.addView(card, LinearLayout.LayoutParams(-1, -2))
                  col.addView(Ui.space(c, 14))

                  toggle = Ui.button(c, "Start", R.drawable.btn_green) { Prefs.setOn(c, !Prefs.isOn(c)); refresh() }
                  col.addView(toggle)

                  warnCard = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_warn)
                      setPadding(Ui.dp(c, 20), Ui.dp(c, 20), Ui.dp(c, 20), Ui.dp(c, 20))
                  }
                  warnCard.addView(Ui.label(c, "⚠️ فعّل خدمة الحماية", 17f, 0xFFFFD54F.toInt(), true))
                  warnCard.addView(Ui.space(c, 6))
                  warnCard.addView(Ui.label(c, "افتح الإعدادات ← حارس ← شغّله. إذا كان الخيار رمادي: معلومات التطبيق ← ⋮ ← السماح بالإعدادات المقيّدة", 13f, Ui.GRAY))
                  warnCard.addView(Ui.button(c, "فتح الإعدادات", R.drawable.btn_amber, 0xFF1B1B1B.toInt()) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  col.addView(Ui.space(c, 18))
                  col.addView(warnCard, LinearLayout.LayoutParams(-1, -2))

                  col.addView(Ui.space(c, 36))
                  lastTxt = Ui.label(c, "", 12f, 0xFF7C93A0.toInt())
                  col.addView(lastTxt)

                  setContentView(ScrollView(c).apply {
                      setBackgroundResource(R.drawable.bg_main)
                      isFillViewport = true
                      addView(col)
                  })
              }

              override fun onResume() { super.onResume(); h.post(tick) }

              override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

              private fun refresh() {
                  val on = Prefs.isOn(this)
                  if (on) {
                      statusTitle.text = "الحماية شغّالة ✅"
                      statusTitle.setTextColor(0xFF69F0AE.toInt())
                      statusSub.text = "YouTube ممنوع الآن"
                  } else {
                      statusTitle.text = "الحماية متوقفة"
                      statusTitle.setTextColor(0xFFB0BEC5.toInt())
                      statusSub.text = "YouTube مسموح"
                  }
                  toggle.text = if (on) "Stop" else "Start"
                  toggle.setBackgroundResource(if (on) R.drawable.btn_red else R.drawable.btn_green)
                  toggle.setPadding(Ui.dp(this, 16), Ui.dp(this, 18), Ui.dp(this, 16), Ui.dp(this, 18))
                  warnCard.visibility = if (BlockerService.instance != null) View.GONE else View.VISIBLE
                  val last = Prefs.dbg(this, "last")
                  lastTxt.text = if (last.isEmpty()) "الإصدار 15" else "الإصدار 15 · آخر منع: $last"
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/Prefs.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Context

          object Prefs {
              private fun p(c: Context) = c.getSharedPreferences("guard", Context.MODE_PRIVATE)

              fun isOn(c: Context) = p(c).getBoolean("on", false)
              fun setOn(c: Context, v: Boolean) = p(c).edit().putBoolean("on", v).apply()

              fun setDbg(c: Context, k: String, v: String) = p(c).edit().putString("dbg_" + k, v).apply()
              fun dbg(c: Context, k: String): String = p(c).getString("dbg_" + k, "") ?: ""
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/Ui.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Context
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView

          object Ui {
              const val WHITE = 0xFFFFFFFF.toInt()
              const val GRAY = 0xFF9FB3BF.toInt()

              fun dp(c: Context, v: Int) = (v * c.resources.displayMetrics.density).toInt()

              fun label(c: Context, s: String, sp: Float, color: Int = WHITE, bold: Boolean = false) = TextView(c).apply {
                  text = s
                  textSize = sp
                  setTextColor(color)
                  gravity = Gravity.CENTER
                  if (bold) setTypeface(typeface, Typeface.BOLD)
                  setLineSpacing(0f, 1.25f)
              }

              fun button(c: Context, s: String, bg: Int, color: Int = WHITE, f: () -> Unit) =
                  label(c, s, 19f, color, true).apply {
                      setBackgroundResource(bg)
                      setPadding(dp(c, 16), dp(c, 18), dp(c, 16), dp(c, 18))
                      isClickable = true
                      setOnClickListener { f() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(c, 14) }
                  }

              fun space(c: Context, h: Int) = View(c).apply { layoutParams = LinearLayout.LayoutParams(-1, dp(c, h)) }
          }
          EOF_FILE
