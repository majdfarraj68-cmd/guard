name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project and build
        run: |
          set -e
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Guard"
          include(":app")
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.guard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20
                  versionName = "20"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("fixed.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <package android:name="com.google.android.youtube" />
              </queries>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".WatcherService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Keeps the local VPN protection armed and re-enables it when the phone is unlocked" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">ثبات</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BlockVpnService.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream

          // A local VPN that captures ONLY the YouTube app's traffic and drops it,
          // so the YouTube app has no internet while protection is on.
          class BlockVpnService : VpnService() {
              private var tun: ParcelFileDescriptor? = null
              private var reader: Thread? = null

              companion object {
                  @Volatile var running = false
                  const val ACTION_STOP = "com.example.guard.STOP"
                  const val YT = "com.google.android.youtube"
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopVpn()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startVpn()
                  return START_STICKY
              }

              @Synchronized
              private fun startVpn() {
                  if (tun != null) return
                  try {
                      val pfd = Builder()
                          .setSession("حارس")
                          .setBlocking(true)
                          .addAddress("10.77.0.1", 32)
                          .addRoute("0.0.0.0", 0)
                          .addAddress("fd00:77::1", 128)
                          .addRoute("::", 0)
                          .addAllowedApplication(YT)
                          .establish()
                      if (pfd == null) {
                          Prefs.setDbg(this, "err", "establish returned null")
                          return
                      }
                      tun = pfd
                      running = true
                      Prefs.setDbg(this, "err", "")
                      reader = Thread {
                          val input = FileInputStream(pfd.fileDescriptor)
                          val buf = ByteArray(32767)
                          try { while (input.read(buf) >= 0) { /* drop everything */ } } catch (_: Exception) {}
                      }.also { it.isDaemon = true; it.start() }
                  } catch (t: Throwable) {
                      running = false
                      Prefs.setDbg(this, "err", t.toString())
                  }
              }

              @Synchronized
              private fun stopVpn() {
                  running = false
                  try { tun?.close() } catch (_: Exception) {}
                  tun = null
                  reader?.interrupt()
                  reader = null
              }

              override fun onRevoke() {
                  stopVpn()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  stopVpn()
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BootReceiver.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          // Runs after the first unlock following a reboot (and after an app update).
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      Intent.ACTION_BOOT_COMPLETED,
                      Intent.ACTION_MY_PACKAGE_REPLACED,
                      "android.intent.action.QUICKBOOT_POWERON" -> WatcherService.start(context, "boot")
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/HomePage.kt <<'EOF_FILE'
          package com.example.guard

          import android.animation.ObjectAnimator
          import android.animation.PropertyValuesHolder
          import android.animation.ValueAnimator
          import android.content.Context
          import android.view.Gravity
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class HomePage(private val a: MainActivity) : Page {
              private class Stat(val view: View, val num: TextView)

              private val c: Context = a
              private lateinit var content: LinearLayout
              private lateinit var statusTitle: TextView
              private lateinit var statusSub: TextView
              private lateinit var vpnDot: View
              private lateinit var vpnText: TextView
              private lateinit var toggle: TextView
              private lateinit var glow: FrameLayout
              private lateinit var curTv: TextView
              private lateinit var bestTv: TextView
              private lateinit var shieldIdle: LinearLayout
              private lateinit var shieldActive: LinearLayout
              private lateinit var ring: RingView
              private lateinit var ringTime: TextView
              private lateinit var shieldMsg: TextView
              private lateinit var logSub: TextView
              private var pulse: ObjectAnimator? = null
              private var lastCur = 0
              private var lastBest = 0
              private var toggleKey = -1
              private var wasShield = false

              override val root: View = build()

              private fun build(): View {
                  val scroll = ScrollView(c)
                  scroll.background = T.screenBg()
                  scroll.isFillViewport = true
                  scroll.isVerticalScrollBarEnabled = false

                  content = LinearLayout(c)
                  content.orientation = LinearLayout.VERTICAL
                  content.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  content.setPadding(T.dp(c, 20), T.dp(c, 44), T.dp(c, 20), T.dp(c, 28))
                  scroll.addView(content, FrameLayout.LayoutParams(T.MATCH, T.WRAP))

                  content.addView(topBar(), T.lpd(c, T.MATCH, T.WRAP))
                  content.addView(hero(), T.lpd(c, T.MATCH, T.WRAP, 0, 22, 0, 0))
                  content.addView(statsRow(), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  content.addView(shieldArea(), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  content.addView(logCard(), T.lpd(c, T.MATCH, T.WRAP, 0, 14, 0, 0))
                  val foot = T.text(c, "كل يوم ثبات هو انتصار", 13f, T.MUTED)
                  foot.gravity = Gravity.CENTER
                  content.addView(foot, T.lpd(c, T.MATCH, T.WRAP, 0, 22, 0, 0))
                  return scroll
              }

              private fun topBar(): View {
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val titles = LinearLayout(c)
                  titles.orientation = LinearLayout.VERTICAL
                  titles.addView(T.text(c, "ثبات", 30f, T.TEXT, true))
                  titles.addView(T.text(c, "درعك في لحظات الضعف", 13f, T.SUB))
                  row.addView(titles, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  row.addView(T.roundIcon(c, IconView.SLIDERS) { a.goSettings() }, LinearLayout.LayoutParams(T.dp(c, 44), T.dp(c, 44)))
                  return row
              }

              private fun hero(): View {
                  val card = LinearLayout(c)
                  card.orientation = LinearLayout.VERTICAL
                  card.gravity = Gravity.CENTER_HORIZONTAL
                  card.background = T.card(c, 28)
                  card.setPadding(T.dp(c, 20), T.dp(c, 22), T.dp(c, 20), T.dp(c, 22))

                  glow = FrameLayout(c)
                  val halo = View(c)
                  halo.background = T.halo(c, 0x552EE59D, 150)
                  glow.addView(halo, FrameLayout.LayoutParams(T.dp(c, 150), T.dp(c, 150), Gravity.CENTER))
                  val shield = IconView(c, IconView.SHIELD, T.GREEN)
                  shield.setIconFill(0x332EE59D)
                  glow.addView(shield, FrameLayout.LayoutParams(T.dp(c, 78), T.dp(c, 78), Gravity.CENTER))
                  card.addView(glow, LinearLayout.LayoutParams(T.dp(c, 150), T.dp(c, 150)))

                  statusTitle = T.text(c, "", 22f, T.TEXT, true)
                  card.addView(statusTitle, T.lpd(c, T.WRAP, T.WRAP, 0, 4, 0, 0))
                  statusSub = T.text(c, "", 13f, T.SUB)
                  card.addView(statusSub, T.lpd(c, T.WRAP, T.WRAP, 0, 4, 0, 0))

                  val chip = LinearLayout(c)
                  chip.orientation = LinearLayout.HORIZONTAL
                  chip.gravity = Gravity.CENTER_VERTICAL
                  chip.background = T.card(c, 16, 0x14FFFFFF, 0x1FFFFFFF)
                  chip.setPadding(T.dp(c, 12), T.dp(c, 6), T.dp(c, 12), T.dp(c, 6))
                  vpnDot = View(c)
                  chip.addView(vpnDot, LinearLayout.LayoutParams(T.dp(c, 8), T.dp(c, 8)))
                  chip.addView(T.space(c, 8, 1))
                  vpnText = T.text(c, "", 12.5f, T.SUB)
                  chip.addView(vpnText)
                  card.addView(chip, T.lpd(c, T.WRAP, T.WRAP, 0, 12, 0, 0))

                  toggle = T.button(c, "", T.grad(c, T.GREEN_D, T.GREEN, 20), T.ON_GREEN)
                  toggle.setOnClickListener { a.toggleProtection() }
                  card.addView(toggle, T.lpd(c, T.MATCH, T.WRAP, 0, 18, 0, 0))
                  return card
              }

              private fun stat(kind: Int, tint: Int, label: String, unit: String): Stat {
                  val box = LinearLayout(c)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.background = T.card(c, 22)
                  box.setPadding(T.dp(c, 14), T.dp(c, 18), T.dp(c, 14), T.dp(c, 16))
                  box.addView(IconView(c, kind, tint), LinearLayout.LayoutParams(T.dp(c, 26), T.dp(c, 26)))
                  val num = T.text(c, "0", 34f, T.TEXT, true)
                  box.addView(num, T.lpd(c, T.WRAP, T.WRAP, 0, 8, 0, 0))
                  box.addView(T.text(c, unit, 12f, T.SUB))
                  box.addView(T.text(c, label, 13f, tint, true), T.lpd(c, T.WRAP, T.WRAP, 0, 6, 0, 0))
                  return Stat(box, num)
              }

              private fun statsRow(): View {
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  val cur = stat(IconView.FLAME, T.AMBER, "الأيام الحالية", "يوم")
                  val best = stat(IconView.STAR, T.BLUE, "أفضل سلسلة", "يوم")
                  curTv = cur.num
                  bestTv = best.num
                  row.addView(cur.view, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  row.addView(T.space(c, 12, 1))
                  row.addView(best.view, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  return row
              }

              private fun shieldArea(): View {
                  val box = LinearLayout(c)
                  box.orientation = LinearLayout.VERTICAL

                  shieldIdle = LinearLayout(c)
                  shieldIdle.orientation = LinearLayout.HORIZONTAL
                  shieldIdle.gravity = Gravity.CENTER_VERTICAL
                  shieldIdle.background = T.grad(c, T.BLUE_D, T.GREEN_D, 24)
                  shieldIdle.setPadding(T.dp(c, 18), T.dp(c, 18), T.dp(c, 18), T.dp(c, 18))
                  shieldIdle.addView(IconView(c, IconView.TIMER, 0xFFFFFFFF.toInt()), LinearLayout.LayoutParams(T.dp(c, 30), T.dp(c, 30)))
                  shieldIdle.addView(T.space(c, 14, 1))
                  val texts = LinearLayout(c)
                  texts.orientation = LinearLayout.VERTICAL
                  texts.addView(T.text(c, "درع الـ10 دقائق", 17f, 0xFFFFFFFF.toInt(), true))
                  texts.addView(T.text(c, "تحصين فوري للحظات الصعبة: لا يمكن إيقاف الحماية خلال 10 دقائق", 12.5f, 0xCCFFFFFF.toInt()))
                  shieldIdle.addView(texts, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  shieldIdle.addView(IconView(c, IconView.CHEVRON, 0xFFFFFFFF.toInt()), LinearLayout.LayoutParams(T.dp(c, 22), T.dp(c, 22)))
                  shieldIdle.setOnClickListener {
                      a.confirm(
                          "تفعيل درع الـ10 دقائق؟",
                          "ستبقى الحماية مفعّلة ولا يمكن إيقافها من التطبيق لمدة 10 دقائق. استخدمه عند اللحظات الصعبة.",
                          "فعّل الدرع"
                      ) { a.startShield() }
                  }
                  T.pressable(shieldIdle)
                  box.addView(shieldIdle, T.lpd(c, T.MATCH, T.WRAP))

                  shieldActive = LinearLayout(c)
                  shieldActive.orientation = LinearLayout.VERTICAL
                  shieldActive.gravity = Gravity.CENTER_HORIZONTAL
                  shieldActive.background = T.card(c, 24, 0x1A4FB3F6, 0x554FB3F6)
                  shieldActive.setPadding(T.dp(c, 18), T.dp(c, 18), T.dp(c, 18), T.dp(c, 18))
                  shieldActive.visibility = View.GONE
                  shieldActive.addView(T.text(c, "الدرع نشط", 17f, T.TEXT, true))
                  val ringBox = FrameLayout(c)
                  ring = RingView(c)
                  ringBox.addView(ring, FrameLayout.LayoutParams(T.dp(c, 132), T.dp(c, 132), Gravity.CENTER))
                  ringTime = T.text(c, "10:00", 28f, T.TEXT, true)
                  ringBox.addView(ringTime, FrameLayout.LayoutParams(T.WRAP, T.WRAP, Gravity.CENTER))
                  shieldActive.addView(ringBox, T.lpd(c, T.MATCH, T.dp(c, 140), 0, 8, 0, 0))
                  shieldMsg = T.text(c, "", 14f, T.SUB)
                  shieldMsg.gravity = Gravity.CENTER
                  shieldActive.addView(shieldMsg, T.lpd(c, T.MATCH, T.WRAP, 0, 6, 0, 0))
                  box.addView(shieldActive, T.lpd(c, T.MATCH, T.WRAP))
                  return box
              }

              private fun logCard(): View {
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.background = T.card(c, 24)
                  row.setPadding(T.dp(c, 18), T.dp(c, 18), T.dp(c, 18), T.dp(c, 18))
                  row.addView(IconView(c, IconView.CALENDAR, T.GREEN), LinearLayout.LayoutParams(T.dp(c, 28), T.dp(c, 28)))
                  row.addView(T.space(c, 14, 1))
                  val texts = LinearLayout(c)
                  texts.orientation = LinearLayout.VERTICAL
                  texts.addView(T.text(c, "سجل انتصاراتي", 17f, T.TEXT, true))
                  logSub = T.text(c, "", 12.5f, T.SUB)
                  texts.addView(logSub)
                  row.addView(texts, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  row.addView(IconView(c, IconView.CHEVRON, T.SUB), LinearLayout.LayoutParams(T.dp(c, 22), T.dp(c, 22)))
                  row.setOnClickListener { a.goLog() }
                  T.pressable(row)
                  return row
              }

              override fun refresh() {
                  val running = BlockVpnService.running
                  val armed = Prefs.armed(c)
                  val paused = Prefs.paused(c)
                  val left = Prefs.shieldLeft(c)
                  val locked = left > 0L && running

                  val dot: Int
                  when {
                      running -> {
                          statusTitle.text = "الحماية تعمل"
                          statusTitle.setTextColor(T.GREEN)
                          statusSub.text = "YouTube بدون إنترنت الآن"
                          vpnText.text = "VPN: شغّال"
                          dot = T.GREEN
                      }
                      armed && paused -> {
                          statusTitle.text = "الحماية متوقفة مؤقتًا"
                          statusTitle.setTextColor(T.AMBER)
                          statusSub.text = "تعود تلقائيًا عند فتح القفل القادم"
                          vpnText.text = "VPN: متوقف مؤقتًا"
                          dot = T.AMBER
                      }
                      armed -> {
                          statusTitle.text = "جارٍ التشغيل"
                          statusTitle.setTextColor(T.AMBER)
                          statusSub.text = "تبدأ الحماية تلقائيًا خلال لحظات"
                          vpnText.text = "VPN: بانتظار التشغيل"
                          dot = T.AMBER
                      }
                      else -> {
                          statusTitle.text = "الحماية غير مفعّلة"
                          statusTitle.setTextColor(T.SUB)
                          statusSub.text = "اضغط تشغيل للإعداد الأول"
                          vpnText.text = "VPN: غير مفعّل"
                          dot = T.MUTED
                      }
                  }
                  vpnDot.background = T.oval(dot)

                  val key = if (running) (if (locked) 1 else 0) else 2
                  if (key != toggleKey) {
                      toggleKey = key
                      if (running) {
                          toggle.background = T.outline(c, T.AMBER, 20)
                          toggle.setTextColor(T.AMBER)
                      } else {
                          toggle.background = T.grad(c, T.GREEN_D, T.GREEN, 20)
                          toggle.setTextColor(T.ON_GREEN)
                      }
                      toggle.setPadding(T.dp(c, 16), T.dp(c, 16), T.dp(c, 16), T.dp(c, 16))
                  }
                  toggle.text = if (running) (if (locked) "مقفل بالدرع" else "إيقاف مؤقت") else (if (armed) "تشغيل الآن" else "تشغيل الحماية")
                  toggle.alpha = if (locked) 0.5f else 1f

                  shieldIdle.visibility = if (left > 0L) View.GONE else View.VISIBLE
                  shieldActive.visibility = if (left > 0L) View.VISIBLE else View.GONE
                  if (left > 0L) {
                      ring.progress = left / 600000f
                      val s = (left / 1000L).toInt()
                      ringTime.text = "%02d:%02d".format(s / 60, s % 60)
                      shieldMsg.text = Msgs.shield(left / 60000L)
                  }
                  if (wasShield && left == 0L) a.toast("انتهى الدرع. أحسنت، أنت أقوى من اللحظة.")
                  wasShield = left > 0L

                  val today = StreakStore.today()
                  val m = StreakStore.load(c)
                  val cur = StreakMath.current(m, today)
                  val best = StreakStore.bestEver(c, m, today)
                  if (cur != lastCur) {
                      T.countTo(curTv, lastCur, cur)
                      lastCur = cur
                  }
                  if (best != lastBest) {
                      T.countTo(bestTv, lastBest, best)
                      lastBest = best
                  }
                  logSub.text = when (m[today]) {
                      1 -> "اليوم: نجاح"
                      2 -> "اليوم: انتكاسة، ابدأ من جديد بهدوء"
                      else -> "اليوم: غير مسجل"
                  }
                  updatePulse(running)
              }

              private fun updatePulse(running: Boolean) {
                  if (running) {
                      if (pulse == null) {
                          val p = ObjectAnimator.ofPropertyValuesHolder(
                              glow,
                              PropertyValuesHolder.ofFloat("scaleX", 1f, 1.07f),
                              PropertyValuesHolder.ofFloat("scaleY", 1f, 1.07f)
                          )
                          p.duration = 1700
                          p.repeatCount = ValueAnimator.INFINITE
                          p.repeatMode = ValueAnimator.REVERSE
                          p.start()
                          pulse = p
                      }
                  } else {
                      pulse?.cancel()
                      pulse = null
                      glow.scaleX = 1f
                      glow.scaleY = 1f
                  }
              }

              override fun onShown() {
                  for (i in 0 until content.childCount) {
                      val v = content.getChildAt(i)
                      v.alpha = 0f
                      v.translationY = T.dp(c, 18).toFloat()
                      v.animate().alpha(1f).translationY(0f).setStartDelay(60L * i).setDuration(320)
                          .setInterpolator(DecelerateInterpolator()).start()
                  }
              }

              override fun onHidden() {
                  pulse?.cancel()
                  pulse = null
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/IconView.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.View

          // Unified line icons drawn on a 24x24 grid (no image files, always crisp).
          class IconView(c: Context, private val kind: Int, private var tint: Int) : View(c) {
              companion object {
                  const val SHIELD = 0
                  const val FLAME = 1
                  const val STAR = 2
                  const val SLIDERS = 3
                  const val CHECK = 4
                  const val BACK = 5
                  const val CHEVRON = 6
                  const val CALENDAR = 7
                  const val TIMER = 8
              }

              private var fillC = 0
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  stroke.style = Paint.Style.STROKE
                  stroke.strokeCap = Paint.Cap.ROUND
                  stroke.strokeJoin = Paint.Join.ROUND
                  stroke.strokeWidth = 1.8f
                  fillP.style = Paint.Style.FILL
              }

              fun setIconTint(color: Int) {
                  tint = color
                  invalidate()
              }

              fun setIconFill(color: Int) {
                  fillC = color
                  invalidate()
              }

              private fun paintPath(cv: Canvas, p: Path) {
                  if (fillC != 0) cv.drawPath(p, fillP)
                  cv.drawPath(p, stroke)
              }

              override fun onDraw(canvas: Canvas) {
                  val s = minOf(width, height).toFloat()
                  if (s <= 0f) return
                  canvas.save()
                  canvas.translate((width - s) / 2f, (height - s) / 2f)
                  canvas.scale(s / 24f, s / 24f)
                  stroke.color = tint
                  fillP.color = fillC
                  when (kind) {
                      SHIELD -> {
                          val p = Path()
                          p.moveTo(12f, 2.5f)
                          p.lineTo(20f, 5.5f)
                          p.lineTo(20f, 11.5f)
                          p.cubicTo(20f, 16.5f, 16.5f, 20.5f, 12f, 21.5f)
                          p.cubicTo(7.5f, 20.5f, 4f, 16.5f, 4f, 11.5f)
                          p.lineTo(4f, 5.5f)
                          p.close()
                          paintPath(canvas, p)
                          val k = Path()
                          k.moveTo(8.5f, 12f)
                          k.lineTo(11f, 14.5f)
                          k.lineTo(15.5f, 9.5f)
                          canvas.drawPath(k, stroke)
                      }
                      FLAME -> {
                          val p = Path()
                          p.moveTo(12f, 2.5f)
                          p.cubicTo(12f, 2.5f, 18.5f, 8f, 18.5f, 14f)
                          p.cubicTo(18.5f, 18f, 15.5f, 21.5f, 12f, 21.5f)
                          p.cubicTo(8.5f, 21.5f, 5.5f, 18f, 5.5f, 14f)
                          p.cubicTo(5.5f, 11.5f, 7f, 9.5f, 8.5f, 8.5f)
                          p.cubicTo(8.7f, 10.5f, 9.7f, 11.5f, 10.8f, 11.8f)
                          p.cubicTo(10.5f, 8.5f, 11f, 5f, 12f, 2.5f)
                          p.close()
                          paintPath(canvas, p)
                      }
                      STAR -> {
                          val p = Path()
                          for (i in 0 until 10) {
                              val ang = Math.PI / 5.0 * i - Math.PI / 2.0
                              val r = if (i % 2 == 0) 9.5 else 4.0
                              val x = (12.0 + r * Math.cos(ang)).toFloat()
                              val y = (12.5 + r * Math.sin(ang)).toFloat()
                              if (i == 0) p.moveTo(x, y) else p.lineTo(x, y)
                          }
                          p.close()
                          paintPath(canvas, p)
                      }
                      SLIDERS -> {
                          canvas.drawLine(4f, 6f, 20f, 6f, stroke)
                          canvas.drawLine(4f, 12f, 20f, 12f, stroke)
                          canvas.drawLine(4f, 18f, 20f, 18f, stroke)
                          fillP.color = tint
                          canvas.drawCircle(9f, 6f, 2.4f, fillP)
                          canvas.drawCircle(16f, 12f, 2.4f, fillP)
                          canvas.drawCircle(8f, 18f, 2.4f, fillP)
                      }
                      CHECK -> {
                          val p = Path()
                          p.moveTo(5f, 12.5f)
                          p.lineTo(10f, 17.5f)
                          p.lineTo(19f, 7f)
                          canvas.drawPath(p, stroke)
                      }
                      BACK -> {
                          canvas.drawLine(4f, 12f, 20f, 12f, stroke)
                          val p = Path()
                          p.moveTo(14f, 6f)
                          p.lineTo(20f, 12f)
                          p.lineTo(14f, 18f)
                          canvas.drawPath(p, stroke)
                      }
                      CHEVRON -> {
                          val p = Path()
                          p.moveTo(15f, 5f)
                          p.lineTo(8f, 12f)
                          p.lineTo(15f, 19f)
                          canvas.drawPath(p, stroke)
                      }
                      CALENDAR -> {
                          canvas.drawRoundRect(RectF(4f, 5.5f, 20f, 20.5f), 3f, 3f, stroke)
                          canvas.drawLine(4f, 10f, 20f, 10f, stroke)
                          canvas.drawLine(8f, 3.5f, 8f, 7f, stroke)
                          canvas.drawLine(16f, 3.5f, 16f, 7f, stroke)
                          val p = Path()
                          p.moveTo(9f, 15f)
                          p.lineTo(11f, 17f)
                          p.lineTo(15f, 13f)
                          canvas.drawPath(p, stroke)
                      }
                      TIMER -> {
                          canvas.drawCircle(12f, 13.5f, 7.5f, stroke)
                          canvas.drawLine(12f, 13.5f, 12f, 9.5f, stroke)
                          canvas.drawLine(9.5f, 2.8f, 14.5f, 2.8f, stroke)
                      }
                  }
                  canvas.restore()
              }
          }
