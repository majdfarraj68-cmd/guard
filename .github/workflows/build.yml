name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project and build
        run: |
          set -e
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Guard"
          include(":app")
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.guard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_calm.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="270" android:startColor="#0B3D3A" android:centerColor="#14655A" android:endColor="#1F8A6E" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_card.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1FFFFFFF" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_main.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="270" android:startColor="#0F2027" android:centerColor="#203A43" android:endColor="#2C5364" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_warn.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#26FFB300" />
              <stroke android:width="1dp" android:color="#66FFB300" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_amber.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFB300" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_green.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="0" android:startColor="#11998E" android:endColor="#38EF7D" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_outline.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00000000" />
              <stroke android:width="2dp" android:color="#66FFFFFF" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_red.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="0" android:startColor="#CB2D3E" android:endColor="#EF473A" />
              <corners android:radius="28dp" />
          </shape>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">حارس</string>
              <string name="service_desc">يراقب فتح يوتيوب ويعرض سؤال التأكيد قبل الدخول.</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50"
              android:description="@string/service_desc" />
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/BlockerService.kt <<'EOF_FILE'
          package com.example.guard

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout

          class BlockerService : AccessibilityService() {
              private var overlay: View? = null
              private var locked = false
              private var inYt = false
              private val h = Handler(Looper.getMainLooper())
              private val msgs = listOf(
                  "أنت أقوى من هذه اللحظة.\nالرغبة موجة وبتعدّي 💪",
                  "كل مرة بتقاوم فيها بتصير أقوى.\nابتعد عن الجوال وغيّر مكانك.",
                  "قم، اغسل وجهك، وامشِ شوي.\nبعد دقايق راح تشكر نفسك 🌿",
                  "قرارك الآن بيحمي احترامك لنفسك.\nاترك الجوال وانشغل بشي ثاني."
              )

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED || locked) return
                  val pkg = e.packageName?.toString() ?: return
                  if (pkg == "com.google.android.youtube") {
                      if (!Prefs.isActive(this) || overlay != null) { inYt = true; return }
                      if (!inYt) {
                          inYt = true
                          if (Prefs.isBlocked(this)) showMessage() else showQuestion()
                      }
                  } else if (pkg != packageName && pkg != "com.android.systemui" && !pkg.contains("inputmethod")) {
                      inYt = false
                      hide()
                  }
              }

              override fun onInterrupt() {}

              private fun showQuestion() {
                  val r = page(R.drawable.bg_main)
                  r.addView(Ui.label(this, "🤔", 72f))
                  r.addView(Ui.space(this, 12))
                  r.addView(Ui.label(this, "وقفة قبل ما تكمل", 16f, Ui.GRAY))
                  r.addView(Ui.space(this, 8))
                  r.addView(Ui.label(this, "هل أنت في وقت شهوة الآن؟", 30f, bold = true))
                  r.addView(Ui.space(this, 8))
                  r.addView(Ui.label(this, "كن صادقًا مع نفسك، القرار لك.", 15f, Ui.GRAY))
                  r.addView(Ui.space(this, 36))
                  r.addView(Ui.button(this, "نعم، أنا كذلك", R.drawable.btn_red) { Prefs.block(this); hide(); showMessage() })
                  r.addView(Ui.button(this, "لا، أنا بخير", R.drawable.btn_green) { Prefs.allow(this); hide() })
                  show(r)
              }

              private fun showMessage() {
                  locked = true
                  inYt = false
                  val r = page(R.drawable.bg_calm)
                  r.addView(Ui.label(this, "🌿", 72f))
                  r.addView(Ui.space(this, 20))
                  r.addView(Ui.label(this, msgs.random(), 26f, bold = true))
                  r.addView(Ui.space(this, 28))
                  r.addView(Ui.label(this, "جارٍ إرجاعك للشاشة الرئيسية…", 14f, 0xFFB2DFDB.toInt()))
                  show(r)
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  h.postDelayed({ locked = false; hide() }, 5000)
              }

              private fun page(bg: Int): LinearLayout {
                  val p = Ui.dp(this, 32)
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundResource(bg)
                      setPadding(p, p, p, p)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      isFocusableInTouchMode = true
                      setOnKeyListener { _, k, _ -> k == KeyEvent.KEYCODE_BACK }
                  }
              }

              private fun show(root: LinearLayout) {
                  hide()
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.OPAQUE
                  )
                  (getSystemService(WINDOW_SERVICE) as WindowManager).addView(root, lp)
                  overlay = root
                  root.requestFocus()
              }

              private fun hide() {
                  overlay?.let {
                      try { (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it) } catch (_: Exception) {}
                  }
                  overlay = null
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/MainActivity.kt <<'EOF_FILE'
          package com.example.guard

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var statusTitle: TextView
              private lateinit var statusSub: TextView
              private lateinit var startBtn: TextView
              private lateinit var stopBtn: TextView
              private lateinit var warnCard: LinearLayout

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val c: Context = this
                  window.statusBarColor = 0xFF0F2027.toInt()
                  window.navigationBarColor = 0xFF2C5364.toInt()

                  val col = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setPadding(Ui.dp(c, 24), Ui.dp(c, 56), Ui.dp(c, 24), Ui.dp(c, 32))
                  }
                  col.addView(Ui.label(c, "🛡️", 64f))
                  col.addView(Ui.label(c, "حارس", 34f, bold = true))
                  col.addView(Ui.label(c, "درعك في لحظات الضعف", 15f, Ui.GRAY))
                  col.addView(Ui.space(c, 28))

                  val card = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_card)
                      setPadding(Ui.dp(c, 20), Ui.dp(c, 24), Ui.dp(c, 20), Ui.dp(c, 24))
                  }
                  statusTitle = Ui.label(c, "", 23f, bold = true)
                  statusSub = Ui.label(c, "", 14f, Ui.GRAY)
                  card.addView(statusTitle)
                  card.addView(Ui.space(c, 6))
                  card.addView(statusSub)
                  col.addView(card, LinearLayout.LayoutParams(-1, -2))
                  col.addView(Ui.space(c, 10))

                  startBtn = Ui.button(c, "ابدأ الحماية", R.drawable.btn_green) { Prefs.start(c); refresh() }
                  stopBtn = Ui.button(c, "إيقاف الحماية (بعد 10 دقائق)", R.drawable.btn_outline) { Prefs.requestStop(c); refresh() }
                  col.addView(startBtn)
                  col.addView(stopBtn)

                  warnCard = LinearLayout(c).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundResource(R.drawable.bg_warn)
                      setPadding(Ui.dp(c, 20), Ui.dp(c, 20), Ui.dp(c, 20), Ui.dp(c, 20))
                  }
                  warnCard.addView(Ui.label(c, "⚠️ فعّل خدمة إمكانية الوصول", 17f, 0xFFFFD54F.toInt(), true))
                  warnCard.addView(Ui.space(c, 6))
                  warnCard.addView(Ui.label(c, "بدونها لا تعمل الحماية. إذا كان الخيار رمادي: معلومات التطبيق ← ⋮ ← السماح بالإعدادات المقيّدة", 13f, Ui.GRAY))
                  warnCard.addView(Ui.button(c, "فتح الإعدادات", R.drawable.btn_amber, 0xFF1B1B1B.toInt()) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  col.addView(Ui.space(c, 18))
                  col.addView(warnCard, LinearLayout.LayoutParams(-1, -2))

                  col.addView(Ui.space(c, 32))
                  col.addView(Ui.label(c, "كل مرة تقاوم فيها، تصير أقوى 💪", 14f, Ui.GRAY))

                  setContentView(ScrollView(c).apply {
                      setBackgroundResource(R.drawable.bg_main)
                      isFillViewport = true
                      addView(col)
                  })
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() {
                  val on = Prefs.isActive(this)
                  val st = Prefs.stopAt(this)
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?.contains(packageName) == true
                  when {
                      !on -> {
                          statusTitle.text = "الحماية متوقفة"
                          statusTitle.setTextColor(0xFFB0BEC5.toInt())
                          statusSub.text = "اضغط ابدأ لتفعيل الدرع"
                      }
                      st > 0 -> {
                          statusTitle.text = "الحماية ستتوقف قريبًا"
                          statusTitle.setTextColor(0xFFFFD54F.toInt())
                          statusSub.text = "بعد ${(st - System.currentTimeMillis()) / 60000 + 1} دقيقة"
                      }
                      else -> {
                          statusTitle.text = "الحماية فعّالة ✅"
                          statusTitle.setTextColor(0xFF69F0AE.toInt())
                          statusSub.text = "يسبق أي فتح لـ YouTube سؤال صادق"
                      }
                  }
                  val running = on && st == 0L
                  startBtn.visibility = if (running) View.GONE else View.VISIBLE
                  stopBtn.visibility = if (running) View.VISIBLE else View.GONE
                  warnCard.visibility = if (enabled) View.GONE else View.VISIBLE
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/Prefs.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Context

          object Prefs {
              private fun p(c: Context) = c.getSharedPreferences("guard", Context.MODE_PRIVATE)
              private fun now() = System.currentTimeMillis()

              fun start(c: Context) = p(c).edit().putBoolean("on", true).putLong("stopAt", 0).apply()
              fun requestStop(c: Context) = p(c).edit().putLong("stopAt", now() + 10 * 60_000).apply()
              fun stopAt(c: Context) = p(c).getLong("stopAt", 0)

              fun isActive(c: Context): Boolean {
                  val s = p(c)
                  if (!s.getBoolean("on", false)) return false
                  val st = s.getLong("stopAt", 0)
                  return st == 0L || now() < st
              }

              fun isAllowed(c: Context) = now() < p(c).getLong("allowUntil", 0)
              fun isBlocked(c: Context) = now() < p(c).getLong("blockUntil", 0)
              fun allow(c: Context) = p(c).edit().putLong("allowUntil", now() + 20 * 60_000).putLong("blockUntil", 0).apply()
              fun block(c: Context) = p(c).edit().putLong("blockUntil", now() + 30 * 60_000).putLong("allowUntil", 0).apply()
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/Ui.kt <<'EOF_FILE'
          package com.example.guard

          import android.content.Context
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.TextView

          object Ui {
              const val WHITE = 0xFFFFFFFF.toInt()
              const val GRAY = 0xFF9FB3BF.toInt()

              fun dp(c: Context, v: Int) = (v * c.resources.displayMetrics.density).toInt()

              fun label(c: Context, s: String, sp: Float, color: Int = WHITE, bold: Boolean = false) = TextView(c).apply {
                  text = s
                  textSize = sp
                  setTextColor(color)
                  gravity = Gravity.CENTER
                  if (bold) setTypeface(typeface, Typeface.BOLD)
                  setLineSpacing(0f, 1.25f)
              }

              fun button(c: Context, s: String, bg: Int, color: Int = WHITE, f: () -> Unit) =
                  label(c, s, 19f, color, true).apply {
                      setBackgroundResource(bg)
                      setPadding(dp(c, 16), dp(c, 18), dp(c, 16), dp(c, 18))
                      isClickable = true
                      setOnClickListener { f() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(c, 14) }
                  }

              fun space(c: Context, h: Int) = View(c).apply { layoutParams = LinearLayout.LayoutParams(-1, dp(c, h)) }
          }
          EOF_FILE
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Guard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
