          package com.example.guard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.View

          // Unified line icons drawn on a 24x24 grid (no image files, always crisp).
          class IconView(c: Context, private val kind: Int, private var tint: Int) : View(c) {
              companion object {
                  const val SHIELD = 0
                  const val FLAME = 1
                  const val STAR = 2
                  const val SLIDERS = 3
                  const val CHECK = 4
                  const val BACK = 5
                  const val CHEVRON = 6
                  const val CALENDAR = 7
                  const val TIMER = 8
                  const val WORLD = 9
                  const val QUESTS = 10
                  const val BOOK = 11
                  const val TROPHY = 12
                  const val MEDAL = 13
                  const val LOCK = 14
              }

              private var fillC = 0
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  stroke.style = Paint.Style.STROKE
                  stroke.strokeCap = Paint.Cap.ROUND
                  stroke.strokeJoin = Paint.Join.ROUND
                  stroke.strokeWidth = 1.8f
                  fillP.style = Paint.Style.FILL
              }

              fun setIconTint(color: Int) {
                  tint = color
                  invalidate()
              }

              fun setIconFill(color: Int) {
                  fillC = color
                  invalidate()
              }

              private fun paintPath(cv: Canvas, p: Path) {
                  if (fillC != 0) cv.drawPath(p, fillP)
                  cv.drawPath(p, stroke)
              }

              override fun onDraw(canvas: Canvas) {
                  val s = minOf(width, height).toFloat()
                  if (s <= 0f) return
                  canvas.save()
                  canvas.translate((width - s) / 2f, (height - s) / 2f)
                  canvas.scale(s / 24f, s / 24f)
                  stroke.color = tint
                  fillP.color = fillC
                  when (kind) {
                      SHIELD -> {
                          val p = Path()
                          p.moveTo(12f, 2.5f)
                          p.lineTo(20f, 5.5f)
                          p.lineTo(20f, 11.5f)
                          p.cubicTo(20f, 16.5f, 16.5f, 20.5f, 12f, 21.5f)
                          p.cubicTo(7.5f, 20.5f, 4f, 16.5f, 4f, 11.5f)
                          p.lineTo(4f, 5.5f)
                          p.close()
                          paintPath(canvas, p)
                          val k = Path()
                          k.moveTo(8.5f, 12f)
                          k.lineTo(11f, 14.5f)
                          k.lineTo(15.5f, 9.5f)
                          canvas.drawPath(k, stroke)
                      }
                      FLAME -> {
                          val p = Path()
                          p.moveTo(12f, 2.5f)
                          p.cubicTo(12f, 2.5f, 18.5f, 8f, 18.5f, 14f)
                          p.cubicTo(18.5f, 18f, 15.5f, 21.5f, 12f, 21.5f)
                          p.cubicTo(8.5f, 21.5f, 5.5f, 18f, 5.5f, 14f)
                          p.cubicTo(5.5f, 11.5f, 7f, 9.5f, 8.5f, 8.5f)
                          p.cubicTo(8.7f, 10.5f, 9.7f, 11.5f, 10.8f, 11.8f)
                          p.cubicTo(10.5f, 8.5f, 11f, 5f, 12f, 2.5f)
                          p.close()
                          paintPath(canvas, p)
                      }
                      STAR -> {
                          val p = Path()
                          for (i in 0 until 10) {
                              val ang = Math.PI / 5.0 * i - Math.PI / 2.0
                              val r = if (i % 2 == 0) 9.5 else 4.0
                              val x = (12.0 + r * Math.cos(ang)).toFloat()
                              val y = (12.5 + r * Math.sin(ang)).toFloat()
                              if (i == 0) p.moveTo(x, y) else p.lineTo(x, y)
                          }
                          p.close()
                          paintPath(canvas, p)
                      }
                      SLIDERS -> {
                          canvas.drawLine(4f, 6f, 20f, 6f, stroke)
                          canvas.drawLine(4f, 12f, 20f, 12f, stroke)
                          canvas.drawLine(4f, 18f, 20f, 18f, stroke)
                          fillP.color = tint
                          canvas.drawCircle(9f, 6f, 2.4f, fillP)
                          canvas.drawCircle(16f, 12f, 2.4f, fillP)
                          canvas.drawCircle(8f, 18f, 2.4f, fillP)
                      }
                      CHECK -> {
                          val p = Path()
                          p.moveTo(5f, 12.5f)
                          p.lineTo(10f, 17.5f)
                          p.lineTo(19f, 7f)
                          canvas.drawPath(p, stroke)
                      }
                      BACK -> {
                          canvas.drawLine(4f, 12f, 20f, 12f, stroke)
                          val p = Path()
                          p.moveTo(14f, 6f)
                          p.lineTo(20f, 12f)
                          p.lineTo(14f, 18f)
                          canvas.drawPath(p, stroke)
                      }
                      CHEVRON -> {
                          val p = Path()
                          p.moveTo(15f, 5f)
                          p.lineTo(8f, 12f)
                          p.lineTo(15f, 19f)
                          canvas.drawPath(p, stroke)
                      }
                      CALENDAR -> {
                          canvas.drawRoundRect(RectF(4f, 5.5f, 20f, 20.5f), 3f, 3f, stroke)
                          canvas.drawLine(4f, 10f, 20f, 10f, stroke)
                          canvas.drawLine(8f, 3.5f, 8f, 7f, stroke)
                          canvas.drawLine(16f, 3.5f, 16f, 7f, stroke)
                          val p = Path()
                          p.moveTo(9f, 15f)
                          p.lineTo(11f, 17f)
                          p.lineTo(15f, 13f)
                          canvas.drawPath(p, stroke)
                      }
                      TIMER -> {
                          canvas.drawCircle(12f, 13.5f, 7.5f, stroke)
                          canvas.drawLine(12f, 13.5f, 12f, 9.5f, stroke)
                          canvas.drawLine(9.5f, 2.8f, 14.5f, 2.8f, stroke)
                      }
                      WORLD -> {
                          canvas.drawCircle(12f, 12f, 9f, stroke)
                          canvas.drawOval(RectF(8f, 3f, 16f, 21f), stroke)
                          canvas.drawLine(3f, 12f, 21f, 12f, stroke)
                      }
                      QUESTS -> {
                          canvas.drawRoundRect(RectF(4f, 4f, 20f, 20f), 3.5f, 3.5f, stroke)
                          val p = Path()
                          p.moveTo(8f, 12.3f)
                          p.lineTo(10.8f, 15f)
                          p.lineTo(16f, 9.2f)
                          canvas.drawPath(p, stroke)
                      }
                      BOOK -> {
                          canvas.drawRoundRect(RectF(3.5f, 5f, 12f, 19f), 1.8f, 1.8f, stroke)
                          canvas.drawRoundRect(RectF(12f, 5f, 20.5f, 19f), 1.8f, 1.8f, stroke)
                          canvas.drawLine(6f, 9f, 9.5f, 9f, stroke)
                          canvas.drawLine(14.5f, 9f, 18f, 9f, stroke)
                      }
                      TROPHY -> {
                          val p = Path()
                          p.moveTo(7f, 4f)
                          p.lineTo(17f, 4f)
                          p.lineTo(16f, 10f)
                          p.cubicTo(15.5f, 12.5f, 13.5f, 14f, 12f, 14f)
                          p.cubicTo(10.5f, 14f, 8.5f, 12.5f, 8f, 10f)
                          p.close()
                          canvas.drawPath(p, stroke)
                          val l = Path()
                          l.moveTo(7f, 6f)
                          l.cubicTo(4f, 6f, 4f, 10f, 8f, 10.5f)
                          canvas.drawPath(l, stroke)
                          val r = Path()
                          r.moveTo(17f, 6f)
                          r.cubicTo(20f, 6f, 20f, 10f, 16f, 10.5f)
                          canvas.drawPath(r, stroke)
                          canvas.drawLine(12f, 14f, 12f, 18f, stroke)
                          canvas.drawLine(8f, 20f, 16f, 20f, stroke)
                      }
                      MEDAL -> {
                          canvas.drawCircle(12f, 9.5f, 5.5f, stroke)
                          val p = Path()
                          p.moveTo(8.5f, 14f)
                          p.lineTo(7f, 21f)
                          p.lineTo(12f, 18.5f)
                          p.lineTo(17f, 21f)
                          p.lineTo(15.5f, 14f)
                          canvas.drawPath(p, stroke)
                      }
                      LOCK -> {
                          canvas.drawRoundRect(RectF(6f, 11f, 18f, 21f), 2.5f, 2.5f, stroke)
                          val p = Path()
                          p.moveTo(8.5f, 11f)
                          p.lineTo(8.5f, 8f)
                          p.cubicTo(8.5f, 4.5f, 15.5f, 4.5f, 15.5f, 8f)
                          p.lineTo(15.5f, 11f)
                          canvas.drawPath(p, stroke)
                      }
                  }
                  canvas.restore()
              }
          }
