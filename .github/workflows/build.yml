          package com.example.guard

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.drawable.GradientDrawable
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          // Hosts the pages (world, quests, journal, achievements, settings) with a bottom navigation bar,
          // celebrations (level up / new region / new badge) and the optional YouTube protection actions.
          // The protection code itself (BlockVpnService / VpnController / WatcherService / BootReceiver) is unchanged.
          class MainActivity : Activity() {
              private lateinit var frame: FrameLayout
              private lateinit var pages: List<Page>
              private val navIcons = ArrayList<IconView>()
              private val navLabels = ArrayList<TextView>()
              private var current: Page? = null
              private var currentIdx = -1
              private var pendingShield = false
              private var lastXp = 0
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() {
                      current?.refresh()
                      h.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = T.BG_TOP
                  window.navigationBarColor = T.NAV_BG
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
                  }
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(T.BG_TOP)
                  frame = FrameLayout(this)
                  root.addView(frame, LinearLayout.LayoutParams(T.MATCH, 0, 1f))
                  root.addView(buildNav(), LinearLayout.LayoutParams(T.MATCH, T.WRAP))
                  setContentView(root)

                  pages = listOf(HomePage(this), QuestsPage(this), JournalPage(this), AchievementsPage(this), SettingsPage(this))
                  val snap = GameStore.snapshot(this)
                  lastXp = snap.xp
                  GameStore.takeCelebrations(this, snap)
                  open(0)
              }

              // ---- bottom navigation ----
              private fun buildNav(): View {
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val g = GradientDrawable()
                  g.setColor(T.NAV_BG)
                  g.setStroke(T.dp(this, 1), 0x22FFFFFF)
                  bar.background = g
                  val labels = listOf("عالمي", "المهمات", "مذكراتي", "إنجازاتي")
                  val kinds = listOf(IconView.WORLD, IconView.QUESTS, IconView.BOOK, IconView.TROPHY)
                  for (i in 0 until 4) {
                      val item = LinearLayout(this)
                      item.orientation = LinearLayout.VERTICAL
                      item.gravity = Gravity.CENTER_HORIZONTAL
                      item.setPadding(0, T.dp(this, 8), 0, T.dp(this, 8))
                      val ic = IconView(this, kinds[i], T.MUTED)
                      item.addView(ic, LinearLayout.LayoutParams(T.dp(this, 24), T.dp(this, 24)))
                      val tv = T.text(this, labels[i], 11f, T.MUTED, true)
                      item.addView(tv, T.lpd(this, T.WRAP, T.WRAP, 0, 3, 0, 0))
                      item.setOnClickListener { open(i) }
                      navIcons.add(ic)
                      navLabels.add(tv)
                      bar.addView(item, LinearLayout.LayoutParams(0, T.WRAP, 1f))
                  }
                  return bar
              }

              private fun setNavSelected(idx: Int) {
                  for (i in 0 until navIcons.size) {
                      val on = i == idx
                      navIcons[i].setIconTint(if (on) T.GREEN else T.MUTED)
                      navLabels[i].setTextColor(if (on) T.GREEN else T.MUTED)
                      navIcons[i].animate().scaleX(if (on) 1.18f else 1f).scaleY(if (on) 1.18f else 1f).setDuration(180).start()
                  }
              }

              // ---- navigation (fade + slide) ----
              private fun open(idx: Int) {
                  if (idx == currentIdx) return
                  val forward = idx > currentIdx
                  val p = pages[idx]
                  val old = current
                  current = p
                  currentIdx = idx
                  val dist = T.dp(this, 28).toFloat()
                  p.root.animate().cancel()
                  (p.root.parent as? ViewGroup)?.removeView(p.root)
                  p.root.alpha = 0f
                  p.root.translationX = if (forward) -dist else dist
                  frame.addView(p.root, FrameLayout.LayoutParams(T.MATCH, T.MATCH))
                  p.refresh()
                  p.root.animate().alpha(1f).translationX(0f).setDuration(260)
                      .setInterpolator(DecelerateInterpolator()).start()
                  p.onShown()
                  setNavSelected(idx)
                  if (old != null) {
                      old.onHidden()
                      old.root.animate().alpha(0f).translationX(if (forward) dist else -dist).setDuration(200)
                          .withEndAction { if (current !== old) frame.removeView(old.root) }.start()
                  }
              }

              fun goTab(i: Int) = open(i)
              fun goHome() = open(0)
              fun goSettings() = open(4)

              override fun onBackPressed() {
                  if (currentIdx != 0) open(0) else super.onBackPressed()
              }

              // ---- helpers used by the pages ----
              fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              }

              fun confirm(title: String, msg: String, yes: String, onYes: () -> Unit) {
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(title)
                      .setMessage(msg)
                      .setPositiveButton(yes) { _, _ -> onYes() }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              private fun xpPop(s: String) {
                  val tv = T.text(this, s, 22f, T.GREEN, true)
                  tv.background = T.card(this, 20, 0xCC0B1A2B.toInt(), 0x552EE59D)
                  tv.setPadding(T.dp(this, 18), T.dp(this, 8), T.dp(this, 18), T.dp(this, 8))
                  val lp = FrameLayout.LayoutParams(T.WRAP, T.WRAP, Gravity.CENTER_HORIZONTAL or Gravity.BOTTOM)
                  lp.bottomMargin = T.dp(this, 90)
                  frame.addView(tv, lp)
                  tv.alpha = 0f
                  tv.animate().alpha(1f).translationY(-T.dp(this, 40).toFloat()).setDuration(500).withEndAction {
                      tv.animate().alpha(0f).setDuration(500).withEndAction { frame.removeView(tv) }.start()
                  }.start()
              }

              // Call after anything that can change XP, level or badges.
              fun afterChange() {
                  val snap = GameStore.snapshot(this)
                  if (snap.xp > lastXp) xpPop("+" + (snap.xp - lastXp) + " XP")
                  lastXp = snap.xp
                  val cel = GameStore.takeCelebrations(this, snap)
                  if (cel.level > 0 || cel.badges.isNotEmpty()) celebrate(cel)
                  current?.refresh()
              }

              private fun celebrate(cel: GameStore.Celebration) {
                  val sb = StringBuilder()
                  if (cel.level > 0) {
                      sb.append("ارتقيت إلى المستوى ").append(cel.level).append(": ").append(Msgs.levelTitle(cel.level)).append("\n")
                      if (cel.newRegion) {
                          sb.append("منطقة جديدة في عالمك: ").append(Msgs.regionName(GameMath.regionsUnlocked(cel.level) - 1)).append("\n")
                      }
                  }
                  for (b in cel.badges) sb.append("شارة جديدة: ").append(Msgs.badgeTitle(b)).append("\n")
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("مبروك!")
                      .setMessage(sb.toString().trim())
                      .setPositiveButton("رائع", null)
                      .show()
              }

              // ---- optional YouTube protection actions (unchanged behaviour) ----
              fun toggleProtection() {
                  if (BlockVpnService.running) requestStop() else requestStart()
              }

              fun requestStart() {
                  // VPN consent is asked once, with the system dialog; nothing is skipped or forced
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 77) else launch()
              }

              fun startShield() {
                  pendingShield = true
                  requestStart()
              }

              private fun launch() {
                  Prefs.setArmed(this, true)
                  Prefs.setPaused(this, false)
                  startService(Intent(this, BlockVpnService::class.java))
                  WatcherService.start(this, "start")
                  if (pendingShield) {
                      pendingShield = false
                      Prefs.setShieldUntil(this, System.currentTimeMillis() + 10L * 60L * 1000L)
                  }
                  current?.refresh()
              }

              fun requestStop() {
                  val left = Prefs.shieldLeft(this)
                  if (left > 0L) {
                      toast("الدرع نشط: لا يمكن إيقاف الحماية الآن (باقي " + ((left / 60000L) + 1L) + " د)")
                      return
                  }
                  if (!BlockVpnService.running) {
                      toast("الحماية متوقفة بالفعل")
                      return
                  }
                  confirm(
                      "إيقاف الحماية مؤقتًا؟",
                      "ستتوقف الحماية مؤقتًا وتعود تلقائيًا عند فتح القفل القادم. هل أنت متأكد؟",
                      "نعم، أوقف مؤقتًا"
                  ) {
                      // Stop = pause until the next unlock / boot / Start (same behaviour as before)
                      Prefs.setPaused(this, true)
                      startService(Intent(this, BlockVpnService::class.java).setAction(BlockVpnService.ACTION_STOP))
                      h.postDelayed({ current?.refresh() }, 400)
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 77) {
                      if (resultCode == RESULT_OK) launch() else pendingShield = false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (Prefs.armed(this)) WatcherService.start(this, "ensure")
                  h.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(tick)
              }
          }
          EOF_FILE
