          package com.example.guard

          import android.content.Context

          // Local persistence for the game layer (SharedPreferences: survives restarts and reboots).
          // XP is derived from history; levels, XP and badges are kept as high-water marks so a stumble
          // (or an edited day) never takes away something you already earned.
          object GameStore {
              class Snapshot(
                  val xp: Int, val level: Int, val best: Int, val cur: Int, val totalSuccess: Int,
                  val journalDays: Int, val perfect: Int, val earned: List<String>
              )

              class Celebration(val level: Int, val newRegion: Boolean, val badges: List<String>)

              private fun sp(c: Context) = c.getSharedPreferences("game", Context.MODE_PRIVATE)

              // ---- daily quests (bit mask per day) ----
              fun mask(c: Context, day: Long): Int = sp(c).getInt("qd_$day", 0)

              fun setQuest(c: Context, day: Long, idx: Int, done: Boolean) {
                  var m = mask(c, day)
                  m = if (done) (m or (1 shl idx)) else (m and (1 shl idx).inv())
                  sp(c).edit().putInt("qd_$day", m).commit()
              }

              fun questMasks(c: Context): MutableMap<Long, Int> {
                  val m = HashMap<Long, Int>()
                  for ((k, v) in sp(c).all) {
                      if (k.startsWith("qd_") && v is Int) {
                          val d = k.substring(3).toLongOrNull()
                          if (d != null) m[d] = v
                      }
                  }
                  return m
              }

              // ---- journal ----
              fun journal(c: Context, day: Long): Pair<String, String> =
                  Pair(sp(c).getString("ja_$day", "") ?: "", sp(c).getString("jb_$day", "") ?: "")

              fun saveJournal(c: Context, day: Long, a: String, b: String) {
                  val e = sp(c).edit()
                  if (a.isBlank() && b.isBlank()) {
                      e.remove("ja_$day")
                      e.remove("jb_$day")
                  } else {
                      e.putString("ja_$day", a.trim())
                      e.putString("jb_$day", b.trim())
                  }
                  e.commit()
              }

              fun journalDays(c: Context): Set<Long> {
                  val out = HashSet<Long>()
                  for ((k, v) in sp(c).all) {
                      if ((k.startsWith("ja_") || k.startsWith("jb_")) && v is String && v.isNotBlank()) {
                          val d = k.substring(3).toLongOrNull()
                          if (d != null) out.add(d)
                      }
                  }
                  return out
              }

              // ---- progress ----
              fun snapshot(c: Context): Snapshot {
                  val today = StreakStore.today()
                  val log = StreakStore.load(c)
                  val masks = questMasks(c)
                  val jd = journalDays(c)
                  val best = StreakStore.bestEver(c, log, today)
                  val cur = StreakMath.current(log, today)
                  val derived = GameMath.totalXp(masks, log, jd, best)
                  val s = sp(c)
                  val stored = s.getInt("xp_ever", 0)
                  val xp = if (derived > stored) derived else stored
                  if (xp != stored) s.edit().putInt("xp_ever", xp).apply()
                  val level = GameMath.levelForXp(xp)
                  val total = StreakMath.count(log, StreakMath.SUCCESS)
                  val perfect = GameMath.perfectDays(masks, log)

                  val st = GameMath.Stats()
                  st.bestStreak = best
                  st.totalSuccess = total
                  st.journalDays = jd.size
                  st.perfectDays = perfect
                  st.level = level
                  st.comeback = GameMath.comeback(log)

                  val all = HashSet<String>()
                  val raw = s.getString("badges", "") ?: ""
                  for (p in raw.split(",")) if (p.isNotEmpty()) all.add(p)
                  all.addAll(GameMath.earnedList(st))
                  val joined = all.sorted().joinToString(",")
                  if (joined != raw) s.edit().putString("badges", joined).apply()
                  val ordered = GameMath.BADGES.filter { all.contains(it) }
                  return Snapshot(xp, level, best, cur, total, jd.size, perfect, ordered)
              }

              // Returns what is new since the last time the user was told (level up / new region / new badges).
              // The very first call only records the current state silently.
              fun takeCelebrations(c: Context, snap: Snapshot): Celebration {
                  val s = sp(c)
                  if (!s.contains("level_seen")) {
                      s.edit().putInt("level_seen", snap.level).putString("badges_seen", snap.earned.joinToString(",")).commit()
                      return Celebration(0, false, emptyList())
                  }
                  val seenLevel = s.getInt("level_seen", 1)
                  val seenBadges = HashSet<String>()
                  for (p in (s.getString("badges_seen", "") ?: "").split(",")) if (p.isNotEmpty()) seenBadges.add(p)
                  val fresh = snap.earned.filter { !seenBadges.contains(it) }
                  val up = if (snap.level > seenLevel) snap.level else 0
                  val newRegion = up > 0 && GameMath.regionsUnlocked(up) > GameMath.regionsUnlocked(seenLevel)
                  if (up > 0 || fresh.isNotEmpty()) {
                      seenBadges.addAll(fresh)
                      s.edit()
                          .putInt("level_seen", if (snap.level > seenLevel) snap.level else seenLevel)
                          .putString("badges_seen", seenBadges.sorted().joinToString(","))
                          .commit()
                  }
                  return Celebration(up, newRegion, fresh)
              }
          }
