          package com.example.guard

          // All user-facing game text. Encouraging, never blaming.
          object Msgs {
              private val okList = listOf(
                  "أحسنت! يوم جديد يُضاف إلى انتصاراتك.",
                  "كل يوم ثبات يبني قوتك الداخلية.",
                  "أنت تثبت لنفسك أنك قادر. استمر.",
                  "خطوة صغيرة اليوم، وقوة أكبر غدًا.",
                  "فخورون بثباتك. واصل بهدوء."
              )
              private val slipList = listOf(
                  "التعثّر ليس نهاية الطريق. أنت تتعلّم وتعود أقوى.",
                  "لا لوم هنا. أهم ما في الأمر أنك صادق مع نفسك.",
                  "يوم صعب لا يمحو ما بنيته. ابدأ من جديد بهدوء.",
                  "كل من سار في هذا الطريق تعثّر مرة. المهم أن تنهض."
              )
              private val idleList = listOf(
                  "سجّل يومك متى شئت. لا ضغط هنا.",
                  "اليوم غير مسجل بعد، وهذا لا يُحسب نجاحًا ولا تعثّرًا.",
                  "خذ وقتك. حين تكون جاهزًا سجّل يومك."
              )
              private val regions = listOf(
                  "جزيرة الانطلاق", "غابة الهدوء", "بحيرة الصفاء", "جبل العزيمة", "قلعة الثبات", "مدينة النور"
              )
              private val questT = listOf(
                  "ابتعدت عن المقاطع المحفّزة",
                  "تركت الهاتف عند ظهور الرغبة",
                  "مارست نشاطًا مفيدًا"
              )
              private val questD = listOf(
                  "تجنّبت أي محتوى يثير الرغبة",
                  "ابتعدت عن الجوال في لحظة الرغبة",
                  "رياضة أو قراءة أو مشي أو أي شيء ينفعك"
              )
              private val badges = mapOf(
                  "s1" to Pair("خطوة أولى", "أول يوم من الثبات"),
                  "s3" to Pair("ثلاثة أيام", "٣ أيام متتالية من الثبات"),
                  "s7" to Pair("أسبوع كامل", "٧ أيام متتالية"),
                  "s14" to Pair("أسبوعان", "١٤ يومًا متتاليًا"),
                  "s30" to Pair("شهر من الثبات", "٣٠ يومًا متتاليًا"),
                  "j1" to Pair("أول مذكرة", "كتبت أول مذكرة يومية"),
                  "j7" to Pair("كاتب مثابر", "٧ أيام من المذكرات"),
                  "p1" to Pair("يوم مثالي", "أنجزت المهمات الثلاث ونجحت في يوم واحد"),
                  "p7" to Pair("سبعة أيام مثالية", "٧ أيام مثالية"),
                  "c3" to Pair("عودة قوية", "٣ أيام نجاح متتالية بعد تعثّر"),
                  "t10" to Pair("عشرة انتصارات", "١٠ أيام نجاح بالمجموع"),
                  "l5" to Pair("المستوى ٥", "وصلت إلى المستوى ٥"),
                  "l10" to Pair("المستوى ١٠", "وصلت إلى المستوى ١٠")
              )

              private fun pick(list: List<String>, seed: Long): String {
                  val n = list.size.toLong()
                  return list[(((seed % n) + n) % n).toInt()]
              }

              fun ok(day: Long): String = pick(okList, day)
              fun slip(day: Long): String = pick(slipList, day)
              fun idle(day: Long): String = pick(idleList, day)

              fun levelTitle(l: Int): String = when {
                  l <= 1 -> "بذرة"
                  l == 2 -> "نبتة"
                  l <= 4 -> "شتلة"
                  l <= 6 -> "شجرة فتية"
                  l <= 9 -> "محارب هادئ"
                  l <= 14 -> "حارس الثبات"
                  l <= 19 -> "فارس الإرادة"
                  else -> "أسطورة"
              }

              fun regionName(i: Int): String = regions[if (i < 0) 0 else if (i >= regions.size) regions.size - 1 else i]
              fun questTitle(i: Int): String = questT[i]
              fun questDesc(i: Int): String = questD[i]
              fun badgeTitle(id: String): String = badges[id]?.first ?: id
              fun badgeDesc(id: String): String = badges[id]?.second ?: ""

              fun milestone(n: Int): String? = when (n) {
                  1 -> "بداية رائعة، اليوم الأول انتصار."
                  3 -> "٣ أيام متتالية! ثبات جميل."
                  7 -> "أسبوع كامل من الثبات!"
                  14 -> "أسبوعان من الثبات. إنجاز يستحق الفخر."
