          package com.example.guard

          import android.content.Context

          object Prefs {
              private fun p(c: Context) = c.getSharedPreferences("guard", Context.MODE_PRIVATE)

              fun isOn(c: Context) = p(c).getBoolean("on", false)
              fun setOn(c: Context, v: Boolean) = p(c).edit().putBoolean("on", v).apply()

              // armed = first-time setup done; protection then starts by itself at every unlock / boot
              // (falls back to the v18 flag so an existing install keeps working)
              fun armed(c: Context) = p(c).getBoolean("armed", p(c).getBoolean("want_on", false))
              fun setArmed(c: Context, v: Boolean) = p(c).edit().putBoolean("armed", v).apply()

              // paused = Stop was pressed: stay off until the next unlock, boot or Start
              fun paused(c: Context) = p(c).getBoolean("paused", false)
              fun setPaused(c: Context, v: Boolean) = p(c).edit().putBoolean("paused", v).apply()

              // 10-minute shield: while it is active protection cannot be stopped from the app
              fun shieldUntil(c: Context): Long = p(c).getLong("shield_until", 0L)
              fun setShieldUntil(c: Context, v: Long) = p(c).edit().putLong("shield_until", v).apply()
              fun shieldLeft(c: Context): Long = maxOf(0L, shieldUntil(c) - System.currentTimeMillis())

              fun setDbg(c: Context, k: String, v: String) = p(c).edit().putString("dbg_" + k, v).apply()
              fun dbg(c: Context, k: String): String = p(c).getString("dbg_" + k, "") ?: ""
          }
