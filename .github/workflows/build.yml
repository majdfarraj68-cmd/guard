          // Encouraging, never blaming.
          object Msgs {
              private val okList = listOf(
                  "أحسنت! يوم جديد يُضاف إلى انتصاراتك.",
                  "كل يوم ثبات يبني قوتك الداخلية.",
                  "أنت تثبت لنفسك أنك قادر. استمر.",
                  "خطوة صغيرة اليوم، وقوة أكبر غدًا.",
                  "فخورون بثباتك. واصل بهدوء."
              )
              private val slipList = listOf(
