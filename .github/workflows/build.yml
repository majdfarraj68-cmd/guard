          package com.example.guard

          import android.app.AlertDialog
          import android.content.Context
          import android.text.InputType
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.time.LocalDate
          import java.time.format.DateTimeFormatter
          import java.util.Locale

          // "مذكراتي": what helped today and what to improve (+XP once per day). Past entries stay forever.
          class JournalPage(a: MainActivity) : ScrollPage(a) {
              private lateinit var dateTv: TextView
              private lateinit var etA: EditText
              private lateinit var etB: EditText
              private lateinit var statusTv: TextView
              private lateinit var list: LinearLayout
              private var sig = ""

              init {
                  build()
              }

              private fun makeEdit(hint: String): EditText {
                  val e = EditText(c)
                  e.hint = hint
                  e.setHintTextColor(T.MUTED)
                  e.setTextColor(T.TEXT)
                  e.textSize = 15f
                  e.minLines = 3
                  e.gravity = Gravity.TOP or Gravity.START
                  e.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  e.background = T.card(c, 16, 0x14FFFFFF, 0x22FFFFFF)
                  e.setPadding(T.dp(c, 14), T.dp(c, 12), T.dp(c, 14), T.dp(c, 12))
                  return e
              }

              private fun build() {
                  add(header("مذكراتي", "اكتب ما ساعدك وما تريد تحسينه"), 0)

                  val card = T.cardBox(c, 24)
                  card.addView(T.text(c, "مذكرة اليوم", 17f, T.TEXT, true))
                  dateTv = T.text(c, "", 12.5f, T.SUB)
                  card.addView(dateTv)
                  card.addView(T.text(c, "ما الذي ساعدني اليوم؟", 14f, T.GREEN, true), T.lpd(c, T.WRAP, T.WRAP, 0, 14, 0, 0))
                  etA = makeEdit("اكتب هنا...")
                  card.addView(etA, T.lpd(c, T.MATCH, T.WRAP, 0, 8, 0, 0))
                  card.addView(T.text(c, "ما الذي أريد تحسينه؟", 14f, T.AMBER, true), T.lpd(c, T.WRAP, T.WRAP, 0, 14, 0, 0))
                  etB = makeEdit("اكتب هنا...")
                  card.addView(etB, T.lpd(c, T.MATCH, T.WRAP, 0, 8, 0, 0))
                  val save = T.button(c, "حفظ المذكرة (+" + GameMath.JOURNAL_XP + " XP)", T.grad(c, T.GREEN_D, T.GREEN, 18), T.ON_GREEN)
                  save.setOnClickListener { save() }
                  card.addView(save, T.lpd(c, T.MATCH, T.WRAP, 0, 16, 0, 0))
                  statusTv = T.text(c, "", 12.5f, T.GREEN)
                  statusTv.gravity = Gravity.CENTER
                  card.addView(statusTv, T.lpd(c, T.MATCH, T.WRAP, 0, 8, 0, 0))
                  add(card, 16)

                  add(T.text(c, "مذكراتي السابقة", 16f, T.TEXT, true), 22)
                  list = T.vbox(c)
                  add(list, 8)
              }

              private fun fmt(day: Long): String =
                  LocalDate.ofEpochDay(day).format(DateTimeFormatter.ofPattern("EEEE d MMMM", Locale("ar")))

              private fun loadToday() {
                  val p = GameStore.journal(c, StreakStore.today())
                  etA.setText(p.first)
                  etB.setText(p.second)
                  statusTv.text = ""
              }

              private fun save() {
                  GameStore.saveJournal(c, StreakStore.today(), etA.text.toString(), etB.text.toString())
                  statusTv.text = "تم الحفظ"
                  val imm = c.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(etA.windowToken, 0)
                  sig = ""
                  refresh()
                  a.afterChange()
              }

              private fun line(s: String, color: Int): TextView {
                  val tv = T.text(c, s, 13.5f, color)
                  tv.maxLines = 3
                  tv.ellipsize = TextUtils.TruncateAt.END
                  return tv
              }

              private fun entryCard(d: Long): LinearLayout {
                  val card = T.cardBox(c, 20, 16)
                  card.addView(T.text(c, fmt(d), 14f, T.TEXT, true))
                  val p = GameStore.journal(c, d)
                  if (p.first.isNotBlank()) card.addView(line("ساعدني: " + p.first, T.GREEN), T.lpd(c, T.MATCH, T.WRAP, 0, 8, 0, 0))
                  if (p.second.isNotBlank()) card.addView(line("أحسّن: " + p.second, T.AMBER), T.lpd(c, T.MATCH, T.WRAP, 0, 6, 0, 0))
                  card.setOnClickListener {
                      AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(fmt(d))
                          .setMessage("ما ساعدني:\n" + p.first + "\n\nما أريد تحسينه:\n" + p.second)
                          .setPositiveButton("حسنًا", null)
                          .show()
                  }
                  T.pressable(card)
                  return card
              }

              override fun refresh() {
                  val today = StreakStore.today()
                  val days = GameStore.journalDays(c).filter { it != today }.sortedDescending().take(30)
                  val s = days.joinToString(",") + "|" + today
                  if (s == sig) return
                  sig = s
                  dateTv.text = fmt(today)
                  list.removeAllViews()
                  if (days.isEmpty()) {
                      list.addView(T.text(c, "مذكراتك السابقة ستظهر هنا.", 13f, T.MUTED))
                  }
                  for (d in days) list.addView(entryCard(d), T.lpd(c, T.MATCH, T.WRAP, 0, 10, 0, 0))
              }

              override fun onShown() {
                  super.onShown()
                  sig = ""
                  loadToday()
              }
          }
