              private fun fmt(day: Long): String =
                  LocalDate.ofEpochDay(day).format(DateTimeFormatter.ofPattern("EEEE d MMMM", Locale("ar")))

              private fun choose(st: Int) {
                  StreakStore.set(c, StreakStore.today(), st)
                  sig = ""
                  refresh()
                  msgTv.alpha = 0f
                  msgTv.animate().alpha(1f).setDuration(350).setInterpolator(DecelerateInterpolator()).start()
              }

              private fun editDay(day: Long) {
                  AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(fmt(day))
                      .setItems(arrayOf("نجحت", "حصلت انتكاسة", "غير مسجل")) { _, which ->
                          val st = if (which == 0) 1 else if (which == 1) 2 else 0
                          StreakStore.set(c, day, st)
                          sig = ""
                          refresh()
                      }
                      .show()
              }

              private fun styleChoices(st: Int?) {
                  if (st == 1) {
                      okBtn.background = T.grad(c, T.GREEN_D, T.GREEN, 18)
                      okBtn.setTextColor(T.ON_GREEN)
                  } else {
                      okBtn.background = T.outline(c, T.GREEN, 18)
                      okBtn.setTextColor(T.GREEN)
                  }
                  if (st == 2) {
                      slipBtn.background = T.grad(c, T.AMBER_D, T.AMBER, 18)
                      slipBtn.setTextColor(T.ON_AMBER)
                  } else {
                      slipBtn.background = T.outline(c, T.AMBER, 18)
                      slipBtn.setTextColor(T.AMBER)
                  }
              }

              private fun cell(day: Long, st: Int?, isToday: Boolean): View {
                  val f = FrameLayout(c)
                  val size = T.dp(c, 36)
                  val tv = T.text(c, LocalDate.ofEpochDay(day).dayOfMonth.toString(), 13f, T.SUB)
                  tv.gravity = Gravity.CENTER
                  var fill = 0x14FFFFFF
                  var tc = T.SUB
                  var edge = 0
                  if (st == 1) {
                      fill = 0xFF1FBF86.toInt()
                      tc = T.ON_GREEN
                  } else if (st == 2) {
                      fill = 0x33FFB74D
                      tc = T.AMBER
                      edge = T.AMBER
                  }
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(fill)
                  if (isToday) g.setStroke(T.dp(c, 2), T.BLUE) else if (edge != 0) g.setStroke(T.dp(c, 1), edge)
                  tv.background = g
                  tv.setTextColor(tc)
                  f.addView(tv, FrameLayout.LayoutParams(size, size, Gravity.CENTER))
                  f.setOnClickListener { editDay(day) }
                  return f
              }

              private fun buildGrid(m: Map<Long, Int>, today: Long) {
                  grid.removeAllViews()
                  val start = today - 27L
                  for (row in 0 until 4) {
                      val r = LinearLayout(c)
                      r.orientation = LinearLayout.HORIZONTAL
                      for (col in 0 until 7) {
                          val day = start + (row * 7 + col).toLong()
                          r.addView(cell(day, m[day], day == today), LinearLayout.LayoutParams(0, T.dp(c, 44), 1f))
                      }
                      grid.addView(r, T.lpd(c, T.MATCH, T.WRAP, 0, if (row == 0) 0 else 4, 0, 0))
                  }
              }

              override fun refresh() {
                  val today = StreakStore.today()
                  val m = StreakStore.load(c)
                  val s = StreakMath.serialize(m) + "|" + today
                  if (s == sig) return
                  sig = s
                  val cur = StreakMath.current(m, today)
                  curTv.text = cur.toString()
                  bestTv.text = StreakStore.bestEver(c, m, today).toString()
                  totalTv.text = StreakMath.count(m, StreakMath.SUCCESS).toString()
                  dateTv.text = fmt(today)
                  val st: Int? = m[today]
                  styleChoices(st)
                  msgTv.text = if (st == 1) {
                      Msgs.milestone(cur) ?: Msgs.ok(today)
                  } else if (st == 2) {
                      Msgs.slip(today) + "\nإنجازاتك السابقة وأطول سلسلة لك محفوظة."
                  } else {
                      Msgs.idle(today)
                  }
                  clearBtn.visibility = if (st == null) View.GONE else View.VISIBLE
                  buildGrid(m, today)
              }

              override fun onShown() {
                  sig = ""
                  for (i in 0 until content.childCount) {
                      val v = content.getChildAt(i)
                      v.alpha = 0f
                      v.translationY = T.dp(c, 18).toFloat()
                      v.animate().alpha(1f).translationY(0f).setStartDelay(60L * i).setDuration(320)
                          .setInterpolator(DecelerateInterpolator()).start()
                  }
              }

              override fun onHidden() {}
          }
