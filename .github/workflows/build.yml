          package com.example.guard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View

          // Circular countdown for the 10-minute shield.
          class RingView(c: Context) : View(c) {
              var progress: Float = 1f
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val bg = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fg = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  bg.style = Paint.Style.STROKE
                  bg.color = 0x22FFFFFF
                  fg.style = Paint.Style.STROKE
                  fg.color = T.GREEN
                  fg.strokeCap = Paint.Cap.ROUND
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val sw = minOf(w, h) * 0.07f
                  bg.strokeWidth = sw
                  fg.strokeWidth = sw
                  val r = RectF(sw, sw, w - sw, h - sw)
                  canvas.drawArc(r, 0f, 360f, false, bg)
                  canvas.drawArc(r, -90f, 360f * progress, false, fg)
              }
          }
