              }

              private fun bounce(v: View) {
                  v.animate().scaleX(1.25f).scaleY(1.25f).setDuration(120).withEndAction {
                      v.animate().scaleX(1f).scaleY(1f).setDuration(160).start()
                  }.start()
              }

              private fun toggle(i: Int) {
                  val day = StreakStore.today()
                  val done = ((GameStore.mask(c, day) shr i) and 1) == 1
                  GameStore.setQuest(c, day, i, !done)
                  sig = ""
                  refresh()
                  if (!done) bounce(checks[i])
                  a.afterChange()
              }

              private fun choose(st: Int) {
                  StreakStore.set(c, StreakStore.today(), st)
                  sig = ""
                  refresh()
                  msgTv.alpha = 0f
                  msgTv.animate().alpha(1f).setDuration(350).start()
                  a.afterChange()
              }

              private fun styleChoices(st: Int?) {
                  if (st == 1) {
                      okBtn.background = T.grad(c, T.GREEN_D, T.GREEN, 18)
                      okBtn.setTextColor(T.ON_GREEN)
                  } else {
                      okBtn.background = T.outline(c, T.GREEN, 18)
                      okBtn.setTextColor(T.GREEN)
                  }
                  if (st == 2) {
                      slipBtn.background = T.grad(c, T.AMBER_D, T.AMBER, 18)
                      slipBtn.setTextColor(T.ON_AMBER)
                  } else {
                      slipBtn.background = T.outline(c, T.AMBER, 18)
                      slipBtn.setTextColor(T.AMBER)
                  }
              }

              override fun refresh() {
                  val today = StreakStore.today()
                  val mask = GameStore.mask(c, today)
                  val st: Int? = StreakStore.load(c)[today]
                  val s = mask.toString() + "|" + st + "|" + today
                  if (s == sig) return
                  sig = s
                  dateTv.text = LocalDate.ofEpochDay(today).format(DateTimeFormatter.ofPattern("EEEE d MMMM", Locale("ar")))
                  val done = GameMath.questsDone(mask)
                  progText.text = done.toString() + " من " + GameMath.QUESTS + " · " + GameMath.dayXp(mask, st == 1, false) + " XP"
                  progBar.animateTo(done.toFloat() / GameMath.QUESTS.toFloat())
                  for (i in 0 until GameMath.QUESTS) {
                      val on = ((mask shr i) and 1) == 1
                      checks[i].background = if (on) T.oval(T.GREEN) else T.ovalOutline(c, T.MUTED)
                      checkIcons[i].visibility = if (on) View.VISIBLE else View.INVISIBLE
                  }
                  styleChoices(st)
                  val cur = StreakMath.current(StreakStore.load(c), today)
                  msgTv.text = if (st == 1) {
                      Msgs.milestone(cur) ?: Msgs.ok(today)
                  } else if (st == 2) {
                      Msgs.slip(today) + "\nتبدأ سلسلة جديدة الآن، ومستواك وشاراتك وإنجازاتك السابقة محفوظة."
                  } else {
                      Msgs.idle(today)
                  }
                  clearBtn.visibility = if (st == null) View.GONE else View.VISIBLE
              }

              override fun onShown() {
                  super.onShown()
                  sig = ""
              }
          }
